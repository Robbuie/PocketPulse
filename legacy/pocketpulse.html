// PAYCHECK PLANNER TAB (variable expenses distributed across paychecks)
// ══════════════════════════════════════════════════════════════════
function PaycheckTab({budget,setBudget,householdId,debts}){
  const sources=budget.income_sources||[];
  const[showAddSource,setShowAddSource]=useState(false);
  const[editingSource,setEditingSource]=useState(null);
  const[srcForm,setSrcForm]=useState({name:'',frequency:'biweekly',next_date:today(),amount:''});
  const[saving,setSaving]=useState(false);
  const[view,setView]=useState('paychecks');

  // Migrate legacy single-source config on first load
  useEffect(()=>{
    if(sources.length===0&&budget.paycheck_amount>0&&budget.paycheck_next_date){
      const legacy={id:uid(),name:'My Job',frequency:budget.paycheck_frequency||'biweekly',next_date:budget.paycheck_next_date,amount:budget.paycheck_amount};
      const cfg={...budget,income_sources:[legacy]};
      apiSaveBudget(cfg,householdId).then(()=>setBudget(cfg));
    }
  },[]);

  async function saveSources(newSources){
    const totalIncome=totalMonthlyIncome(newSources);
    const cfg={...budget,income_sources:newSources,income:totalIncome};
    await apiSaveBudget(cfg,householdId);
    setBudget(cfg);
  }

  function openAdd(){
    // First source added is primary by default
    const isPrimary=sources.length===0;
    setSrcForm({name:'',frequency:'biweekly',next_date:today(),amount:'',is_primary:isPrimary});
    setEditingSource(null);setShowAddSource(true);
  }
  function openEdit(src){setSrcForm({name:src.name,frequency:src.frequency,next_date:src.next_date,amount:String(src.amount),is_primary:!!src.is_primary});setEditingSource(src);setShowAddSource(true)}

  async function saveSource(){
    if(!srcForm.name.trim()||!srcForm.amount||!srcForm.next_date)return;
    setSaving(true);
    const entry={...srcForm,amount:parseFloat(srcForm.amount)||0,id:editingSource?.id||uid()};
    let newSources=editingSource?sources.map(s=>s.id===editingSource.id?entry:s):[...sources,entry];
    // If this source is being set as primary, clear primary from all others
    if(entry.is_primary){newSources=newSources.map(s=>s.id===entry.id?s:{...s,is_primary:false});}
    // If no primary exists after save, auto-assign to highest-amount source
    if(!newSources.some(s=>s.is_primary)&&newSources.length>0){
      const topId=[...newSources].sort((a,b)=>b.amount-a.amount)[0].id;
      newSources=newSources.map(s=>({...s,is_primary:s.id===topId}));
    }
    await saveSources(newSources);
    setShowAddSource(false);setSaving(false);
  }

  async function setPrimary(id){
    const updated=sources.map(s=>({...s,is_primary:s.id===id}));
    await saveSources(updated);
  }

  async function deleteSource(id){
    if(!confirm('Remove this income source?'))return;
    await saveSources(sources.filter(s=>s.id!==id));
  }

  const[paycheckHistory,setPaycheckHistory]=useState(false);

  const totalMonthly=totalMonthlyIncome(sources);
  const committed=budget.committed_payment||0;
  // Primary = marked is_primary, or highest-amount source as fallback
  const primarySource=sources.find(s=>s.is_primary)||[...sources].sort((a,b)=>b.amount-a.amount)[0]||null;
  const secondarySources=sources.filter(s=>s.id!==primarySource?.id);
  // Generate a large window of primary dates so we can find today's position
  const allPrimaryDates=useMemo(()=>primarySource?getPayDates(primarySource.frequency||'biweekly',primarySource.next_date,36):[],[primarySource]);
  const todayD=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d;},[]);
  // Find the index of the period that contains today (or the first future period)
  const currentIdx=useMemo(()=>{
    for(let i=0;i<allPrimaryDates.length;i++){
      const pd=allPrimaryDates[i];
      const nextPd=allPrimaryDates[i+1]||new Date(pd.getTime()+(14*86400000));
      if(pd<=todayD&&todayD<nextPd)return i;
    }
    // All in past or all future — find first future
    const futureIdx=allPrimaryDates.findIndex(d=>d>=todayD);
    return futureIdx>=0?futureIdx:0;
  },[allPrimaryDates,todayD]);
  // Future periods (current + next 5)
  const primaryDates=useMemo(()=>allPrimaryDates.slice(currentIdx,currentIdx+6),[allPrimaryDates,currentIdx]);
  // Past periods for history
  const pastDates=useMemo(()=>allPrimaryDates.slice(Math.max(0,currentIdx-6),currentIdx).reverse(),[allPrimaryDates,currentIdx]);
  // All secondary pay dates for lookup
  const secondaryAllDates=useMemo(()=>getAllPayDates(secondarySources,36),[secondarySources]);
  const fixExpenses=(budget.expenses||[]).filter(e=>!e.is_variable&&e.due_day);
  const varExpenses=(budget.expenses||[]).filter(e=>e.is_variable);
  const totalChecksPerMonth=sources.reduce((s,src)=>s+checksPerMonth(src.frequency||'biweekly'),0);
  const cashFlow=useMemo(()=>getCashFlow(budget.expenses,debts,committed,60),[budget.expenses,debts,committed]);

  return(<div>
    <div className="st-row"><div className="st">Paycheck Planner</div><button className="btn btn-p sm" onClick={openAdd}>+ Add Income</button></div>

    {/* Income sources list */}
    {sources.length===0
      ?<div className="card" style={{marginBottom:12}}><div className="empty"><div className="empty-icon">💰</div><p style={{marginBottom:14}}>Add your income sources — one per job or income stream. The budget will automatically use the combined total.</p><button className="btn btn-p" onClick={openAdd}>+ Add Income Source</button></div></div>
      :<>
        {sources.map(src=>{
          const monthly=monthlyFromSource(src);
          const freq=FREQS.find(f=>f.v===src.frequency)?.l||src.frequency;
          const isPrimary=src.id===primarySource?.id;
          return(<div key={src.id} style={{background:'var(--surface)',border:`2px solid ${isPrimary?'rgba(16,208,112,.4)':'var(--border)'}`,borderRadius:10,padding:'12px 14px',marginBottom:8}}>
            <div style={{display:'flex',gap:12,alignItems:'center'}}>
              <div style={{fontSize:28}}>{isPrimary?'💼':'💳'}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{fontWeight:700,fontSize:14}}>{src.name}</div>
                  {isPrimary
                    ?<span style={{fontSize:10,background:'var(--gdim)',color:'var(--green)',padding:'2px 6px',borderRadius:4,fontWeight:700}}>★ PRIMARY</span>
                    :<button className="btn btn-s sm" style={{fontSize:10,padding:'2px 7px'}} onClick={()=>setPrimary(src.id)}>Set Primary</button>}
                </div>
                <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{freq} · {f$(src.amount,2)}/check</div>
                <div style={{fontSize:11,color:isPrimary?'var(--green)':'var(--muted)',fontWeight:700,marginTop:2}}>≈ {f$(monthly,2)}/month{isPrimary?' · drives billing periods':' · shows as bonus income'}</div>
              </div>
              <div style={{display:'flex',gap:6,flexShrink:0}}>
                <button className="btn btn-s sm" onClick={()=>openEdit(src)}>Edit</button>
                <button className="btn btn-d sm" onClick={()=>deleteSource(src.id)}>✕</button>
              </div>
            </div>
          </div>);
        })}
        <div className="mcard" style={{marginBottom:14}}>
          <div className="mlabel">Combined Monthly Income</div>
          <div className="mval green">{f$(totalMonthly,2)}</div>
          <div className="msub">{sources.length} source{sources.length!==1?'s':''} · used in Budget automatically</div>
        </div>
      </>}

    {sources.length>0&&<>
      {budget.committed_strategy&&<div className="commit-badge"><span>✅</span><div style={{fontSize:12}}><strong>{budget.committed_strategy==='avalanche'?'Avalanche':'Snowball'}</strong> — {f$(committed,2)}/mo included in each check</div></div>}

      {varExpenses.length>0&&<div className="card" style={{marginBottom:12,borderLeft:'3px solid var(--amber)'}}>
        <div style={{fontSize:12,fontWeight:700,color:'var(--amber)',marginBottom:8}}>⚡ Variable Expenses — estimated per paycheck</div>
        {varExpenses.map(e=>{
          const perCheck=totalChecksPerMonth>0?(parseFloat(e.amount)||0)/totalChecksPerMonth:0;
          return(<div key={e.id} className="kv" style={{padding:'4px 0'}}>
            <span style={{fontSize:13}}>{e.label||e.category}</span>
            <span style={{fontFamily:'var(--mono)',fontSize:13,color:'var(--amber)'}}>{f$(perCheck,2)}<span style={{fontSize:10,color:'var(--muted)',marginLeft:4}}>/check</span></span>
          </div>);
        })}
        <div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>Based on {totalChecksPerMonth.toFixed(1)} total paychecks/month across all sources</div>
      </div>}

      <div style={{display:'flex',gap:6,marginBottom:12}}>
        <button className={`btn sm ${view==='paychecks'&&!paycheckHistory?'btn-p':'btn-s'}`} onClick={()=>{setView('paychecks');setPaycheckHistory(false)}}>💰 Upcoming</button>
        <button className={`btn sm ${view==='paychecks'&&paycheckHistory?'btn-p':'btn-s'}`} onClick={()=>{setView('paychecks');setPaycheckHistory(true)}}>🕐 Past</button>
        <button className={`btn sm ${view==='cashflow'?'btn-p':'btn-s'}`} onClick={()=>setView('cashflow')}>📅 Cash Flow</button>
      </div>

      {view==='paychecks'&&(<>
        {!primarySource&&<div className="alert alert-warn">Add at least one income source to see the paycheck calendar.</div>}
        {primarySource&&(()=>{
          const datesToShow=paycheckHistory?pastDates:primaryDates;
          if(datesToShow.length===0)return<div className="empty"><div className="empty-icon">{paycheckHistory?'🕐':'💰'}</div><p>{paycheckHistory?'No past periods found.':'No upcoming paychecks found. Check your income source next pay date.'}</p></div>;
          return datesToShow.map((pd,i)=>{
            // For history mode, the period goes forward to the next primary date (which is before current)
            // For future mode, the period goes forward to the next primary date
            const periodEnd=paycheckHistory
              ?(i===0?allPrimaryDates[currentIdx]||new Date(pd.getTime()+(14*86400000)):pastDates[i-1]||new Date(pd.getTime()+(14*86400000)))
              :(primaryDates[i+1]||new Date(pd.getTime()+(14*86400000)));
            const secondaryInPeriod=secondaryAllDates.filter(({date})=>date>=pd&&date<periodEnd);
            const secondaryTotal=secondaryInPeriod.reduce((s,{source:src})=>s+(parseFloat(src.amount)||0),0);
            const combinedIncome=(parseFloat(primarySource.amount)||0)+secondaryTotal;
            const bills=getBillsInPeriod(fixExpenses,debts,pd,periodEnd,!paycheckHistory&&i===0?committed:0);
            const perCheck=totalChecksPerMonth>0?1/totalChecksPerMonth:0;
            const varItems=paycheckHistory?[]:varExpenses.map(e=>({id:'v'+e.id,name:(e.label||e.category)+' (est.)',amount:(parseFloat(e.amount)||0)*perCheck,due:new Date(pd),type:'variable',color:CAT_COLORS[e.category]||'var(--amber)'}));
            const allItems=[...bills,...varItems];
            const totalOut=allItems.reduce((s,b)=>s+b.amount,0);
            const remaining=combinedIncome-totalOut;
            const pdStr=pd.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
            const endStr=new Date(periodEnd.getTime()-86400000).toLocaleDateString('en-US',{month:'short',day:'numeric'});
            const isCurrent=!paycheckHistory&&i===0;
            return(<div key={pd.toISOString()} className={`pc-card${isCurrent?' current':''}`}>
              <div className="pc-header" style={{marginBottom:secondaryInPeriod.length?6:12}}>
                <div>
                  <div className="pc-label">{isCurrent?'Current Period':paycheckHistory?'Past Period':'Upcoming'} · {pdStr} – {endStr}</div>
                  <div style={{fontWeight:700,fontSize:13,marginTop:2}}>💼 {primarySource.name}</div>
                </div>
                <div className="pc-amount">{f$(primarySource.amount,2)}</div>
              </div>
              {secondaryInPeriod.map(({date,source:sec},j)=>(
                <div key={j} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0 8px',borderBottom:'1px dashed var(--border)',marginBottom:8}}>
                  <div style={{fontSize:12,fontWeight:600,color:'var(--muted)'}}>💳 {sec.name} <span style={{fontSize:10,fontWeight:400}}>({date.toLocaleDateString('en-US',{month:'short',day:'numeric'})})</span></div>
                  <div style={{fontFamily:'var(--mono)',fontSize:13,fontWeight:700,color:'var(--teal)'}}>+{f$(sec.amount,2)}</div>
                </div>
              ))}
              {secondaryInPeriod.length>0&&(<div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:10,paddingBottom:8,borderBottom:'1px solid var(--border)'}}>
                <span>Combined this period</span>
                <span style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{f$(combinedIncome,2)}</span>
              </div>)}
              {allItems.length?(<>
                {allItems.map((b,j)=>(<div key={j} className="pc-bill">
                  <div style={{width:9,height:9,borderRadius:'50%',background:b.color,flexShrink:0}}/>
                  <div className="pc-bill-name">{b.name}</div>
                  <div className="pc-bill-due">{b.type==='variable'?<span className="var-badge">VAR</span>:b.type==='plan'?'extra':b.due.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
                  <div className="pc-bill-amt" style={{color:b.color}}>-{f$(b.amount,2)}</div>
                </div>))}
                <div className="pc-remaining">
                  <span style={{fontSize:13,fontWeight:600}}>{paycheckHistory?'Bills that period':'Stays in account'}</span>
                  <span style={{fontFamily:'var(--mono)',fontSize:16,fontWeight:800,color:remaining>=0?'var(--green)':'var(--red)'}}>{f$(remaining,2)}</span>
                </div>
              </>):<div style={{fontSize:13,color:'var(--muted)',padding:'8px 0'}}>No bills due · <span style={{color:'var(--green)',fontWeight:700}}>{f$(combinedIncome,2)} {paycheckHistory?'received':'stays in account'}</span></div>}
            </div>);
          });
        })()}
        {fixExpenses.length===0&&varExpenses.length===0&&primarySource&&!paycheckHistory&&<div className="alert alert-warn">Add expenses in Budget. Mark them Variable or set a Due Day to see them here.</div>}
      </>)}

      {view==='cashflow'&&(<>
        <div style={{fontWeight:600,marginBottom:10,fontSize:13}}>Next 60 Days — Fixed Bills</div>
        {cashFlow.length?(<>
          {cashFlow.map((cf,i)=>(<div key={i} className="cf-item" style={{borderLeftColor:cf.color}}>
            <div><div className="cf-day" style={{color:cf.color}}>{cf.date.getDate()}</div><div style={{fontSize:9,color:'var(--muted)'}}>{cf.date.toLocaleDateString('en-US',{weekday:'short'})}</div></div>
            <div><div className="cf-name">{cf.name}</div><div className="cf-tag">{cf.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · {cf.type==='debt'?'Debt':'Expense'}</div></div>
            <div className="cf-amt" style={{color:cf.color}}>-{f$(cf.amount,2)}</div>
          </div>))}
          <div style={{fontSize:12,color:'var(--muted)',marginTop:8,textAlign:'center'}}>60-day total: <strong style={{color:'var(--red)'}}>{f$(cashFlow.reduce((s,c)=>s+c.amount,0),2)}</strong></div>
        </>):<div className="empty"><div className="empty-icon">📅</div><p>Add due dates to debts and fixed expenses to see the cash flow timeline.</p></div>}
      </>)}
    </>}

    {showAddSource&&<Modal title={editingSource?'Edit Income Source':'Add Income Source'} onClose={()=>setShowAddSource(false)}>
      <div className="fr"><label>Name / Label</label><input placeholder="e.g. Robbuie's Job, Part-time, Side income" value={srcForm.name} onChange={e=>setSrcForm(f=>({...f,name:e.target.value}))} autoFocus/></div>
      <div className="fr"><label>Pay Frequency</label><select value={srcForm.frequency} onChange={e=>setSrcForm(f=>({...f,frequency:e.target.value}))}>{FREQS.map(fr=><option key={fr.v} value={fr.v}>{fr.l}</option>)}</select></div>
      <div className="fg">
        <div className="fr"><label>Net Amount Per Check ($)</label><input type="number" min="0" step="50" placeholder="0.00" value={srcForm.amount} onChange={e=>setSrcForm(f=>({...f,amount:e.target.value}))}/></div>
        <div className="fr"><label>Next Pay Date</label><input type="date" value={srcForm.next_date} onChange={e=>setSrcForm(f=>({...f,next_date:e.target.value}))}/></div>
      </div>
      {sources.length>0&&<label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',textTransform:'none',letterSpacing:0,fontWeight:500,fontSize:13,marginBottom:12}}>
        <input type="checkbox" checked={!!srcForm.is_primary} onChange={e=>setSrcForm(f=>({...f,is_primary:e.target.checked}))} style={{width:'auto',accentColor:'var(--green)'}}/>
        ★ Set as primary income (billing periods follow this schedule)
      </label>}
      {srcForm.amount&&srcForm.frequency&&<div style={{fontSize:12,color:'var(--green)',fontWeight:700,padding:'8px 10px',background:'var(--gdim)',borderRadius:7,marginBottom:12}}>≈ {f$(monthlyFromSource(srcForm),2)}/month</div>}
      <button className="btn btn-p btn-full" onClick={saveSource} disabled={saving||!srcForm.name.trim()||!srcForm.amount}>{saving?<span className="spinner"/>:'Save'}</button>
    </Modal>}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
// PAYOFF STRATEGIES TAB
// ══════════════════════════════════════════════════════════════════
function StrategiesTab({debts,budget,setBudget,householdId}){
  const[extra,setExtra]=useState(budget.committed_extra?.toString()||'100');
  const[committing,setCommitting]=useState(null);
  const xAmt=parseFloat(extra)||0;
  const av=useMemo(()=>simulatePayoff(debts,xAmt,'avalanche'),[debts,xAmt]);
  const sb2=useMemo(()=>simulatePayoff(debts,xAmt,'snowball'),[debts,xAmt]);

  async function commit(strategy,data){
    setCommitting(strategy);
    const cfg={...budget,committed_strategy:strategy,committed_extra:xAmt,committed_payment:data.monthlyTotal};
    const{error}=await apiSaveBudget(cfg,householdId);
    if(!error)setBudget(cfg);
    setCommitting(null);
  }

  async function uncommit(){
    const cfg={...budget,committed_strategy:null,committed_extra:0,committed_payment:0};
    const{error}=await apiSaveBudget(cfg,householdId);
    if(!error)setBudget(cfg);
  }

  if(debts.length<2)return(<div>
    <div className="st">Payoff Strategies</div>
    {budget.committed_strategy&&<div className="commit-badge"><span>✅</span><div><div style={{fontWeight:700}}>Committed to {budget.committed_strategy} plan</div><div style={{fontSize:12,color:'var(--muted)'}}>{f$(budget.committed_payment,2)}/mo flowing into budget + paycheck planner</div></div><button className="btn btn-d sm" style={{marginLeft:'auto'}} onClick={uncommit}>Cancel Plan</button></div>}
    <div className="card"><div className="empty"><div className="empty-icon">🎯</div><p>Add at least 2 debts to compare strategies.</p></div></div>
  </div>);

  const iDiff=sb2.totalInterest-av.totalInterest;
  const mDiff=sb2.months-av.months;
  const avWins=av.totalInterest<=sb2.totalInterest;
  const totalBal=debts.reduce((s,d)=>s+(parseFloat(d.balance)||0),0);

  return(<div>
    <div className="st">Payoff Strategies</div>
    {budget.committed_strategy&&<div className="commit-badge"><span>✅</span><div><div style={{fontWeight:700,fontSize:13}}>Committed to {budget.committed_strategy==='avalanche'?'Avalanche':'Snowball'}</div><div style={{fontSize:12,color:'var(--muted)'}}>{f$(budget.committed_payment,2)}/mo auto-included in budget and paycheck planner</div></div><button className="btn btn-d sm" style={{marginLeft:'auto',flexShrink:0}} onClick={uncommit}>Remove</button></div>}

    <div className="card" style={{marginBottom:16}}>
      <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>Extra Monthly Payment (above minimums)</div>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <input type="number" min="0" step="10" value={extra} onChange={e=>setExtra(e.target.value)} style={{width:110}}/>
        <span className="muted" style={{fontSize:13}}>/month extra</span>
      </div>
    </div>

    <div className="cgrid" style={{marginBottom:14}}>
      {[
        {name:'Avalanche',emoji:'🏔',color:'var(--blue)',data:av,label:'Highest rate first',desc:'Mathematically optimal.',badge:avWins},
        {name:'Snowball',emoji:'⛄',color:'var(--green)',data:sb2,label:'Smallest balance first',desc:'Builds momentum.',badge:!avWins},
      ].map(({name,emoji,color,data,label,desc,badge})=>{
        const strategy=name.toLowerCase();
        const isCommitted=budget.committed_strategy===strategy;
        return(<div key={name} className="card" style={{border:`1px solid ${isCommitted?color:'var(--border)'}`}}>
          <div style={{fontSize:14,fontWeight:800,color,marginBottom:2}}>{emoji} {name}</div>
          <div style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>{label} — {desc}</div>
          {badge&&<div style={{marginBottom:8}}><span className="tag" style={{background:`${color}20`,color}}>Saves most money ✓</span></div>}
          <KV label="Total Months" val={fmo(data.months)}/>
          <KV label="Monthly Payment" val={f$(data.monthlyTotal,2)} color={color}/>
          <KV label="Total Interest" val={f$(data.totalInterest)} color={color}/>
          <KV label="Total Paid" val={f$(totalBal+data.totalInterest)}/>
          <div className="divider"/>
          <div style={{fontSize:10,fontWeight:800,color:'var(--muted)',marginBottom:7}}>PAYOFF ORDER</div>
          {data.payoffOrder.map((d,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',borderBottom:'1px solid var(--border)'}}><span><span style={{color:'var(--faint)',marginRight:5}}>{i+1}.</span>{d.name}</span><span className="muted">{fmo(d.paidOffMonth)}</span></div>))}
          <div style={{marginTop:12}}>
            {isCommitted?(<div style={{textAlign:'center',fontSize:12,color,fontWeight:700}}>✅ Active Plan</div>):(
              <button className="btn btn-p btn-full" onClick={()=>commit(strategy,data)} disabled={!!committing}>{committing===strategy?<span className="spinner"/>:`Commit to ${name} Plan`}</button>
            )}
          </div>
        </div>);
      })}
    </div>

    <div className="card">
      <div style={{fontSize:14,fontWeight:700,marginBottom:8}}>The Verdict</div>
      <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.9}}>
        <p><strong style={{color:'var(--blue)'}}>Avalanche</strong> saves <strong style={{color:avWins?'var(--green)':'var(--red)'}}>{f$(Math.abs(iDiff))} {avWins?'more':'less'} in interest</strong> and takes <strong>{Math.abs(mDiff)} months {avWins&&mDiff>0?'less':'more'}</strong> than Snowball.</p>
        <br/><p style={{fontSize:11,color:'var(--faint)'}}>When you commit to a plan, the monthly payment amount automatically appears in your Budget tab and Paycheck Planner so you never have to enter it manually.</p>
      </div>
    </div>
  </div>);
}

// KIDS TRACKER TAB
// ══════════════════════════════════════════════════════════════════
function FamilyTab({kids,setKids,kidExpenses,setKidExpenses,householdId,userId}){
  const[view,setView]=useState('list');// list | kid detail id
  const[showAddKid,setShowAddKid]=useState(false);
  const[showAddExp,setShowAddExp]=useState(false);
  const[editingExp,setEditingExp]=useState(null);
  const[editExpForm,setEditExpForm]=useState(null);
  const[kidForm,setKidForm]=useState({name:'',emoji:'👦',color:'#10d070'});
  const[expForm,setExpForm]=useState({amount:'',category:KID_CATS[0],description:'',date:today()});
  const[saving,setSaving]=useState(false);
  const[deleting,setDeleting]=useState(null);
  const thisMonth=new Date().toISOString().slice(0,7);

  const activeKid=kids.find(k=>k.id===view);

  async function saveKid(){
    if(!kidForm.name.trim())return;setSaving(true);
    const kid={...kidForm,id:uid(),_new:true};
    const{data,error}=await apiSaveKid(kid,householdId);
    if(!error&&data)setKids(prev=>[...prev,data]);
    setShowAddKid(false);setKidForm({name:'',emoji:'👦',color:'#10d070'});setSaving(false);
  }

  async function deleteKid(id){
    if(!confirm('Remove this member and all their spending?'))return;
    const{error}=await apiDeleteKid(id);
    if(!error){setKids(prev=>prev.filter(k=>k.id!==id));setKidExpenses(prev=>prev.filter(ke=>ke.kid_id!==id));setView('list')}
  }

  async function addExpense(kidId){
    if(!expForm.amount)return;setSaving(true);
    const{data,error}=await apiAddKidExpense({kid_id:kidId,amount:parseFloat(expForm.amount),category:expForm.category,description:expForm.description,date:expForm.date},householdId,userId);
    if(!error&&data)setKidExpenses(prev=>[data,...prev]);
    setShowAddExp(false);setExpForm({amount:'',category:KID_CATS[0],description:'',date:today()});setSaving(false);
  }

  function openEditExp(ke){setEditingExp(ke);setEditExpForm({amount:String(ke.amount),category:ke.category,description:ke.description||'',date:ke.date});}

  async function saveEditExp(){
    if(!editExpForm||!editingExp)return;setSaving(true);
    const updates={amount:parseFloat(editExpForm.amount)||0,category:editExpForm.category,description:editExpForm.description,date:editExpForm.date};
    const{data,error}=await apiUpdateKidExpense(editingExp.id,updates);
    if(!error&&data)setKidExpenses(prev=>prev.map(ke=>ke.id===editingExp.id?{...ke,...updates}:ke));
    setEditingExp(null);setEditExpForm(null);setSaving(false);
  }

  async function deleteExp(id){setDeleting(id);const{error}=await apiDeleteKidExpense(id);if(!error)setKidExpenses(prev=>prev.filter(ke=>ke.id!==id));setDeleting(null)}

  // Kid detail view
  if(activeKid){
    const expenses=kidExpenses.filter(ke=>ke.kid_id===activeKid.id);
    const monthExp=expenses.filter(ke=>ke.date?.startsWith(thisMonth));
    const monthTotal=monthExp.reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0);
    const allTotal=expenses.reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0);
    const catBreak=KID_CATS.map(c=>({cat:c,total:expenses.filter(ke=>ke.category===c).reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0)})).filter(c=>c.total>0);
    return(<div>
      <div className="st-row">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button className="btn btn-s sm" onClick={()=>setView('list')}>← Back</button>
          <div style={{fontSize:26}}>{activeKid.emoji}</div>
          <div className="st" style={{marginBottom:0}}>{activeKid.name}</div>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-p sm" onClick={()=>setShowAddExp(true)}>+ Add</button>
          <button className="btn btn-d sm" onClick={()=>deleteKid(activeKid.id)}>Delete</button>
        </div>
      </div>
      <div className="grid g3" style={{marginBottom:14}}>
        <div className="mcard"><div className="mlabel">This Month</div><div className="mval" style={{color:activeKid.color||'var(--purple)'}}>{f$(monthTotal,2)}</div></div>
        <div className="mcard"><div className="mlabel">All Time</div><div className="mval">{f$(allTotal,2)}</div></div>
        <div className="mcard"><div className="mlabel">Entries</div><div className="mval blue">{expenses.length}</div></div>
      </div>
      {catBreak.length>0&&<div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>By Category</div>
        {catBreak.map(({cat,total})=>(<div key={cat} className="kv" style={{padding:'4px 0'}}><span style={{fontSize:12}}>{cat}</span><span style={{fontFamily:'var(--mono)',fontSize:13,color:activeKid.color||'var(--purple)'}}>{f$(total,2)}</span></div>))}
      </div>}
      {expenses.length?expenses.map(ke=>(<div key={ke.id} className="ke-item">
        <div style={{fontSize:20}}>{ke.category?.split(' ')[0]||'🧾'}</div>
        <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{ke.description||ke.category}</div><div style={{fontSize:11,color:'var(--muted)'}}>{ke.category} · {fdate(ke.date)}</div></div>
        <div style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:700,color:activeKid.color||'var(--purple)',marginRight:6}}>-{f$(ke.amount,2)}</div>
        <button className="btn btn-s sm" style={{padding:'3px 7px'}} onClick={()=>openEditExp(ke)}>✏️</button>
        <button className="btn btn-d sm" style={{padding:'3px 7px'}} onClick={()=>deleteExp(ke.id)} disabled={deleting===ke.id}>{deleting===ke.id?<span className="spinner"/>:'✕'}</button>
      </div>)):<div className="empty"><div className="empty-icon">{activeKid.emoji}</div><p>No spending logged for {activeKid.name} yet.</p></div>}

      {/* Edit expense modal */}
      {editingExp&&editExpForm&&<Modal title="Edit Expense" onClose={()=>{setEditingExp(null);setEditExpForm(null)}}>
        <div className="fg">
          <div className="fr"><label>Amount ($)</label><input type="number" min="0" step="0.01" value={editExpForm.amount} onChange={e=>setEditExpForm(f=>({...f,amount:e.target.value}))}/></div>
          <div className="fr"><label>Date</label><input type="date" value={editExpForm.date} onChange={e=>setEditExpForm(f=>({...f,date:e.target.value}))}/></div>
        </div>
        <div className="fr"><label>Category</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
            {KID_CATS.map(c=>(<button key={c} className={`btn sm ${editExpForm.category===c?'btn-p':'btn-s'}`} onClick={()=>setEditExpForm(f=>({...f,category:c}))}>{c}</button>))}
          </div>
        </div>
        <div className="fr"><label>Description</label><input placeholder="What was this for?" value={editExpForm.description} onChange={e=>setEditExpForm(f=>({...f,description:e.target.value}))}/></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-s" style={{flex:1}} onClick={()=>{setEditingExp(null);setEditExpForm(null)}}>Cancel</button>
          <button className="btn btn-p" style={{flex:2}} onClick={saveEditExp} disabled={saving}>{saving?<span className="spinner"/>:'Save Changes'}</button>
        </div>
      </Modal>}
      {showAddExp&&<Modal title={`Add Expense for ${activeKid.name}`} onClose={()=>setShowAddExp(false)}>
        <div className="fg">
          <div className="fr"><label>Amount ($)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={expForm.amount} onChange={e=>setExpForm(f=>({...f,amount:e.target.value}))}/></div>
          <div className="fr"><label>Date</label><input type="date" value={expForm.date} onChange={e=>setExpForm(f=>({...f,date:e.target.value}))}/></div>
        </div>
        <div className="fr"><label>Category</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
            {KID_CATS.map(c=>(<button key={c} className={`btn sm ${expForm.category===c?'btn-p':'btn-s'}`} onClick={()=>setExpForm(f=>({...f,category:c}))}>{c}</button>))}
          </div>
        </div>
        <div className="fr"><label>Description</label><input placeholder="e.g. Lego set at Target" value={expForm.description} onChange={e=>setExpForm(f=>({...f,description:e.target.value}))}/></div>
        <button className="btn btn-p btn-full" onClick={()=>addExpense(activeKid.id)} disabled={saving}>{saving?<span className="spinner"/>:'Save'}</button>
      </Modal>}
    </div>);
  }

  // List view
  return(<div>
    <div className="st-row"><div className="st">Family Spending 👨‍👩‍👧‍👦</div><button className="btn btn-p sm" onClick={()=>setShowAddKid(true)}>+ Add Member</button></div>
    {kids.length?(
      kids.map(kid=>{
        const monthSpend=kidExpenses.filter(ke=>ke.kid_id===kid.id&&ke.date?.startsWith(thisMonth)).reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0);
        const totalSpend=kidExpenses.filter(ke=>ke.kid_id===kid.id).reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0);
        const recentCats=[...new Set(kidExpenses.filter(ke=>ke.kid_id===kid.id).slice(0,5).map(ke=>ke.category?.split(' ')[0]))].slice(0,4).join(' ');
        return(<div key={kid.id} className="kid-card" style={{borderColor:kid.color+'44'}} onClick={()=>setView(kid.id)}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div className="kid-avatar" style={{background:kid.color+'22',border:`2px solid ${kid.color}44`}}>{kid.emoji}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:15}}>{kid.name}</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>{recentCats||'No spending yet'}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div className="kid-spend" style={{color:kid.color}}>{f$(monthSpend,2)}</div>
              <div style={{fontSize:10,color:'var(--muted)'}}>this month</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>{f$(totalSpend,2)} total</div>
            </div>
            <div style={{fontSize:18,color:'var(--faint)',marginLeft:4}}>›</div>

      })
    ):<div className="card"><div className="empty"><div className="empty-icon">👨‍👩‍👧‍👦</div><p style={{marginBottom:14}}>Track spending per family member — add individuals like each child, or a shared <strong>"Everyone"</strong> account for things the whole family uses like outings, meals, or household purchases.</p><button className="btn btn-p" onClick={()=>setShowAddKid(true)}>+ Add First Member</button></div></div>}

      {kids.length>0&&<div className="card" style={{marginTop:12}}>
      <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>This Month — All Members</div>
      <KV label="Total Family Spending" val={f$(kidExpenses.filter(ke=>ke.date?.startsWith(thisMonth)).reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0),2)} color="var(--purple)"/>
    </div>}

    {showAddKid&&<Modal title="Add a Member" onClose={()=>setShowAddKid(false)}>
      <div className="alert alert-info" style={{marginBottom:12,fontSize:11}}>Add individuals like each child, or a shared member like <strong>"Everyone"</strong> or <strong>"Family"</strong> for group purchases.</div>
      <div className="fr"><label>Name</label><input placeholder="e.g. Emma, Jake, Everyone, Family" value={kidForm.name} onChange={e=>setKidForm(f=>({...f,name:e.target.value}))}/></div>
      <div className="fr"><label>Emoji</label><div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>{KID_EMOJIS.map(em=>(<button key={em} className={`btn sm ${kidForm.emoji===em?'btn-p':'btn-s'}`} style={{fontSize:18,padding:'4px 10px'}} onClick={()=>setKidForm(f=>({...f,emoji:em}))}>{em}</button>))}</div></div>
      <div className="fr"><label>Color</label><div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>{KID_COLORS.map(c=>(<div key={c} onClick={()=>setKidForm(f=>({...f,color:c}))} style={{width:28,height:28,borderRadius:'50%',background:c,cursor:'pointer',border:`3px solid ${kidForm.color===c?'white':'transparent'}`,transition:'border .15s'}}/>))}</div></div>
      <button className="btn btn-p btn-full" onClick={saveKid} disabled={saving}>{saving?<span className="spinner"/>:'Add Member'}</button>
    </Modal>}
  </div>);
}

// GROCERY / SHOPPING LIST TAB
// ══════════════════════════════════════════════════════════════════
const DEFAULT_STORES=[
  {id:'walmart',name:'Walmart',icon:'🛒',search:'https://www.walmart.com/search?q='},
  {id:'amazon',name:'Amazon',icon:'📦',search:'https://www.amazon.com/s?k='},
  {id:'kroger',name:'Kroger',icon:'🏪',search:'https://www.kroger.com/search?query='},
  {id:'target',name:'Target',icon:'🎯',search:'https://www.target.com/s?searchTerm='},
  {id:'meijer',name:'Meijer',icon:'🏬',search:'https://www.meijer.com/shopping/search.html?query='},
  {id:'samsclub',name:"Sam's Club",icon:'🏷',search:'https://www.samsclub.com/s/'},
];
const UNITS=['count','lbs','oz','kg','g','gal','fl oz','L','mL','ct','pkg','box','bag','can','bottle','each'];

// Unit normalization — everything converts to a base unit within its group for fair comparison
const UNIT_CONV={
  // Weight → base: oz
  'oz':    {group:'weight',base:'oz',factor:1},
  'lbs':   {group:'weight',base:'oz',factor:16},
  'lb':    {group:'weight',base:'oz',factor:16},
  'g':     {group:'weight',base:'oz',factor:0.035274},
  'kg':    {group:'weight',base:'oz',factor:35.274},
  // Volume → base: fl oz
  'fl oz': {group:'volume',base:'fl oz',factor:1},
  'mL':    {group:'volume',base:'fl oz',factor:0.033814},
  'L':     {group:'volume',base:'fl oz',factor:33.814},
  'gal':   {group:'volume',base:'fl oz',factor:128},
  // Count — no conversion
  'count': {group:'count',base:'count',factor:1},
  'each':  {group:'count',base:'count',factor:1},
  'ct':    {group:'count',base:'count',factor:1},
  'pkg':   {group:'count',base:'count',factor:1},
  'box':   {group:'count',base:'count',factor:1},
  'bag':   {group:'count',base:'count',factor:1},
  'can':   {group:'count',base:'count',factor:1},
  'bottle':{group:'count',base:'count',factor:1},
};

// Normalize a unit price to the base unit of its group (for cross-unit comparison)
function normalizeUnitPrice(pricePerPkgUnit,pkgUnit){
  const c=UNIT_CONV[pkgUnit];
  if(!c||c.group==='count')return{normalized:pricePerPkgUnit,base:pkgUnit||'unit'};
  // price per pkgUnit ÷ factor = price per oz (or fl oz)
  return{normalized:pricePerPkgUnit/c.factor,base:c.base};
}

// Human-readable display of a normalized base price back in a friendlier unit
function friendlyBasePrice(pricePerBase,baseUnit){
  // If base is oz, also show per lb if >$0.50
  if(baseUnit==='oz'&&pricePerBase>0){
    const perLb=pricePerBase*16;
    return`${f$(perLb,2)}/lb (${f$(pricePerBase,3)}/oz)`;
  }
  if(baseUnit==='fl oz'&&pricePerBase>0){
    const perL=pricePerBase*33.814;
    return`${f$(perL,2)}/L (${f$(pricePerBase,3)}/fl oz)`;
  }
  return`${f$(pricePerBase,3)}/${baseUnit}`;
}

// Check if two units are in the same group (can be compared)
function sameUnitGroup(a,b){
  if(!a||!b)return false;
  if(a===b)return true;
  const ca=UNIT_CONV[a],cb=UNIT_CONV[b];
  if(!ca||!cb)return false;
  return ca.group===cb.group;
}

// Deal types that can be attached to a store price entry
const DEAL_TYPES=[
  {v:'pct_off', l:'% Off',       hint:'e.g. 25 for 25% off'},
  {v:'amt_off', l:'$ Off',       hint:'e.g. 1.00 for $1 off'},
  {v:'bogo',    l:'BOGO (Buy 1 Get 1 Free)', hint:'Effective price = half off'},
  {v:'buy_for', l:'Buy X for $Y',hint:'Enter the total price for the bundle'},
];

// Calculate the effective (post-deal) total price from a price entry
function calcEffectivePrice(entry){
  const normal=parseFloat(entry.price)||0;
  const deal=entry.deal;
  if(!deal||!deal.type)return normal;
  if(deal.expires&&deal.expires<today())return normal; // expired — fall back to normal
  const val=parseFloat(deal.value)||0;
  switch(deal.type){
    case'pct_off': return Math.max(0,normal*(1-val/100));
    case'amt_off': return Math.max(0,normal-val);
    case'bogo':    return normal/2; // buy 1 get 1 → effective per-package price is half
    case'buy_for': return val>0?val:normal; // bundle price replaces total price
    default:       return normal;
  }
}

// Is there an active (non-expired) deal on this entry?
function hasActiveDeal(entry){
  if(!entry?.deal?.type)return false;
  if(entry.deal.expires&&entry.deal.expires<today())return false;
  return true;
}

function dealLabel(entry){
  if(!hasActiveDeal(entry))return null;
  const{type,value,expires}=entry.deal;
  const exp=expires?` · exp ${fdate(expires)}`:'';
  if(type==='pct_off')return`${value}% off${exp}`;
  if(type==='amt_off')return`$${parseFloat(value).toFixed(2)} off${exp}`;
  if(type==='bogo')return`BOGO${exp}`;
  if(type==='buy_for')return`Buy for $${parseFloat(value).toFixed(2)}${exp}`;
  return null;
}

function fUnit(qty,unit){
  if(!qty&&!unit)return null;
  if(!unit||unit==='count'||unit==='each')return qty||null;
  return`${qty||''}${qty?' ':''}${unit}`;
}

function GroceryTab({budget,setBudget,householdId}){
  const list=budget.shopping_list||[];
  const activeStoreIds=budget.shopping_stores||DEFAULT_STORES.slice(0,2).map(s=>s.id);
  const customStores=budget.custom_stores||[];
  // All available stores = defaults + custom
  const allStores=[...DEFAULT_STORES,...customStores];
  // Active stores = from all available stores
  const stores=activeStoreIds.map(id=>allStores.find(s=>s.id===id)).filter(Boolean);

  const[showAdd,setShowAdd]=useState(false);
  const[showConfig,setShowConfig]=useState(false);
  const[form,setForm]=useState({name:'',qty:'',unit:'count',notes:''});
  const[saving,setSaving]=useState(false);
  const[filter,setFilter]=useState('active');
  const[editingPrices,setEditingPrices]=useState(null);
  // Custom store add form inside config modal
  const[newStore,setNewStore]=useState({name:'',url:''});
  const[addingStore,setAddingStore]=useState(false);

  async function saveList(newList){
    setSaving(true);
    await apiSaveBudget({...budget,shopping_list:newList},householdId);
    setBudget(b=>({...b,shopping_list:newList}));
    setSaving(false);
  }

  async function addItem(){
    if(!form.name.trim())return;setSaving(true);
    const item={id:uid(),name:form.name.trim(),qty:form.qty.trim(),unit:form.unit,notes:form.notes.trim(),prices:{},checked:false,added:today()};
    await saveList([item,...list]);
    setForm({name:'',qty:'',unit:'count',notes:''});setShowAdd(false);setSaving(false);
  }

  async function toggleCheck(id){await saveList(list.map(i=>i.id===id?{...i,checked:!i.checked}:i))}
  async function deleteItem(id){await saveList(list.filter(i=>i.id!==id))}
  async function clearChecked(){if(!confirm('Remove all checked items?'))return;await saveList(list.filter(i=>!i.checked))}

  // prices stored as {[storeId]: {price, pkgQty, pkgUnit, deal?}} — or legacy number
  function getPriceEntry(item,storeId){
    const raw=item.prices?.[storeId];
    if(!raw)return null;
    if(typeof raw==='number')return{price:raw,pkgQty:1,pkgUnit:item.unit||'count'};
    return raw;
  }
  function getRawNormalUnitPrice(entry){
    if(!entry||!entry.price)return null;
    return parseFloat(entry.price)/(parseFloat(entry.pkgQty)||1);
  }
  function getRawUnitPrice(entry){
    if(!entry||!entry.price)return null;
    return calcEffectivePrice(entry)/(parseFloat(entry.pkgQty)||1);
  }
  function getNormalizedUnitPrice(entry){
    const raw=getRawUnitPrice(entry);
    if(raw==null)return null;
    return normalizeUnitPrice(raw,entry.pkgUnit).normalized;
  }

  async function savePrice(itemId,storeId,field,val){
    const newList=list.map(i=>{
      if(i.id!==itemId)return i;
      const cur=getPriceEntry(i,storeId)||{price:'',pkgQty:1,pkgUnit:i.unit||'count'};
      let updated;
      if(field.startsWith('deal.')){
        const dealField=field.slice(5);
        const curDeal=cur.deal||{type:'',value:'',expires:''};
        updated={...cur,deal:{...curDeal,[dealField]:val}};
        if(dealField==='type'&&!val)updated={...cur,deal:null};
      }else{
        updated={...cur,[field]:val};
      }
      const prices={...(i.prices||{}),[storeId]:updated};
      if(!updated.price&&updated.price!==0)delete prices[storeId];
      return{...i,prices};
    });
    await saveList(newList);
  }

  async function toggleStore(id){
    const next=activeStoreIds.includes(id)
      ?activeStoreIds.filter(s=>s!==id)
      :[...activeStoreIds,id];
    const cfg={...budget,shopping_stores:next};
    await apiSaveBudget(cfg,householdId);
    setBudget(b=>({...b,shopping_stores:next}));
  }

  async function addCustomStore(){
    if(!newStore.name.trim())return;
    setAddingStore(true);
    const id='custom_'+uid();
    // Build a reasonable search URL from the store name if not provided
    const searchBase=newStore.url.trim()
      ?newStore.url.trim()
      :`https://www.google.com/search?q=${newStore.name.trim()}+`;
    const store={id,name:newStore.name.trim(),icon:'🏪',search:searchBase,custom:true};
    const updated=[...customStores,store];
    const updatedActive=[...activeStoreIds,id];
    const cfg={...budget,custom_stores:updated,shopping_stores:updatedActive};
    await apiSaveBudget(cfg,householdId);
    setBudget(b=>({...b,custom_stores:updated,shopping_stores:updatedActive}));
    setNewStore({name:'',url:''});setAddingStore(false);
  }

  async function deleteCustomStore(id){
    const updated=customStores.filter(s=>s.id!==id);
    const updatedActive=activeStoreIds.filter(s=>s!==id);
    const cfg={...budget,custom_stores:updated,shopping_stores:updatedActive};
    await apiSaveBudget(cfg,householdId);
    setBudget(b=>({...b,custom_stores:updated,shopping_stores:updatedActive}));
  }

  function bestStore(item){
    if(!item.prices)return null;
    const entries=Object.keys(item.prices).map(storeId=>{
      const e=getPriceEntry(item,storeId);
      if(!e||!e.price)return null;
      const normalized=getNormalizedUnitPrice(e);
      return normalized!=null?{storeId,normalized}:null;
    }).filter(Boolean);
    if(!entries.length)return null;
    return entries.sort((a,b)=>a.normalized-b.normalized)[0].storeId;
  }

  function searchUrl(store,itemName){
    if(!store.search)return`https://www.google.com/search?q=${encodeURIComponent(store.name+' '+itemName)}`;
    return store.search+encodeURIComponent(itemName);
  }

  const active=list.filter(i=>!i.checked);
  const checked=list.filter(i=>i.checked);
  const shown=filter==='active'?active:list;

  return(<div>
    <div className="st-row">
      <div className="st">Shopping List 🛒</div>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-s sm" onClick={()=>setShowConfig(true)}>⚙️ Stores</button>
        <button className="btn btn-p sm" onClick={()=>setShowAdd(true)}>+ Item</button>
      </div>
    </div>

    {/* Summary bar */}
    <div className="card" style={{marginBottom:12,padding:'10px 14px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:16}}>
          <div><span style={{fontSize:20,fontWeight:800,color:'var(--green)'}}>{active.length}</span><span style={{fontSize:12,color:'var(--muted)',marginLeft:4}}>needed</span></div>
          {checked.length>0&&<div><span style={{fontSize:20,fontWeight:800,color:'var(--muted)'}}>{checked.length}</span><span style={{fontSize:12,color:'var(--muted)',marginLeft:4}}>in cart</span></div>}
        </div>
        <div style={{display:'flex',gap:6}}>
          {['active','all'].map(f=><button key={f} className={`btn sm ${filter===f?'btn-p':'btn-s'}`} onClick={()=>setFilter(f)}>{f==='active'?'Needed':'All'}</button>)}
          {checked.length>0&&<button className="btn btn-d sm" onClick={clearChecked}>Clear Got</button>}
        </div>
      </div>
      {stores.length>0
        ?<div style={{marginTop:6,fontSize:11,color:'var(--muted)'}}>Checking: {stores.map(s=>`${s.icon} ${s.name}`).join(' · ')}</div>
        :<div style={{marginTop:6,fontSize:11,color:'var(--amber)'}}>⚙️ No stores selected — tap Stores to choose.</div>}
    </div>

    {shown.length===0&&<div className="card"><div className="empty"><div className="empty-icon">🛒</div><p>{filter==='active'?'List is empty. Tap + Item to add.':'No items.'}</p></div></div>}

    {shown.map(item=>{
      const best=bestStore(item);
      const hasPrices=item.prices&&Object.keys(item.prices).some(k=>{const e=getPriceEntry(item,k);return e&&e.price>0});
      const isEditing=editingPrices===item.id;
      const unitLabel=fUnit(item.qty,item.unit);
      const bestEntry=best?getPriceEntry(item,best):null;
      const bestNorm=bestEntry&&bestEntry.price?normalizeUnitPrice(getRawUnitPrice(bestEntry),bestEntry.pkgUnit):null;
      const bestStoreName=best?allStores.find(s=>s.id===best)?.name:null;
      const allUnits=hasPrices?Object.keys(item.prices).map(k=>getPriceEntry(item,k)?.pkgUnit).filter(Boolean):[];
      const mixedUnits=allUnits.length>1&&allUnits.some((u,i)=>i>0&&u!==allUnits[0]&&sameUnitGroup(u,allUnits[0]));
      // Count active deals across all stores
      const activeDeals=Object.keys(item.prices||{}).filter(k=>hasActiveDeal(getPriceEntry(item,k))).length;

      return(<div key={item.id} className={`shop-item${item.checked?' checked':''}`} style={{flexDirection:'column',alignItems:'stretch',gap:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div className={`shop-check${item.checked?' done':''}`} onClick={()=>toggleCheck(item.id)}>{item.checked?'✓':''}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className={`shop-name${item.checked?' struck':''}`}>
              {item.name}
              {unitLabel&&<span style={{fontWeight:500,color:'var(--muted)',fontSize:12,marginLeft:6}}>{unitLabel}</span>}
              {activeDeals>0&&<span style={{fontSize:10,background:'var(--adim)',color:'var(--amber)',padding:'1px 5px',borderRadius:3,marginLeft:6,fontWeight:700}}>🏷 {activeDeals} deal{activeDeals>1?'s':''}</span>}
            </div>
            {hasPrices&&bestStoreName&&bestNorm&&(
              <div style={{fontSize:11,color:'var(--green)',fontWeight:700,marginTop:2}}>
                ✓ Best: {bestStoreName} — {friendlyBasePrice(bestNorm.normalized,bestNorm.base)}
                {mixedUnits&&<span style={{fontSize:10,color:'var(--muted)',fontWeight:400,marginLeft:4}}>(converted)</span>}
              </div>
            )}
            {item.notes&&<div className="shop-meta" style={{marginTop:2}}>{item.notes}</div>}
            {/* Price chips */}
            <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:5}}>
              {stores.map(store=>{
                const entry=getPriceEntry(item,store.id);
                const isBest=best===store.id&&hasPrices;
                const rawUnit=entry?getRawUnitPrice(entry):null;
                const norm=rawUnit!=null?normalizeUnitPrice(rawUnit,entry.pkgUnit):null;
                const activeDeal=entry?hasActiveDeal(entry):false;
                const effectivePrice=entry?calcEffectivePrice(entry):null;
                return(
                  <a key={store.id} href={searchUrl(store,item.name)} target="_blank" rel="noopener"
                    className={`price-chip${isBest?' best':''}`} title={`Search ${store.name}`}>
                    <span className="pc-store">{store.icon} {store.name}</span>
                    {entry?.price>0?(
                      <span className="pc-price">
                        {activeDeal&&<span style={{textDecoration:'line-through',opacity:.5,marginRight:3,fontSize:9}}>{f$(entry.price,2)}</span>}
                        {f$(effectivePrice,2)}
                        {activeDeal&&<span style={{fontSize:9,color:isBest?'var(--green)':'var(--amber)',marginLeft:2}}>🏷</span>}
                        {(entry.pkgQty>1||mixedUnits)&&norm&&<span style={{fontSize:9,fontWeight:400,marginLeft:2,opacity:.8}}> ({friendlyBasePrice(norm.normalized,norm.base)})</span>}
                      </span>
                    ):<span style={{fontSize:9,color:'var(--faint)'}}>search →</span>}
                  </a>
                );
              })}
              <button className="price-chip" style={{border:'1px dashed var(--border)',background:'transparent',cursor:'pointer'}}
                onClick={()=>setEditingPrices(isEditing?null:item.id)}>
                <span style={{fontSize:10,color:'var(--muted)'}}>{hasPrices?'✏️ edit':'+ prices'}</span>
              </button>
            </div>
          </div>
          <button className="btn btn-d sm" style={{padding:'3px 7px',flexShrink:0,alignSelf:'flex-start'}} onClick={()=>deleteItem(item.id)}>✕</button>
        </div>

        {/* Per-store price + deal editor */}
        {isEditing&&(
          <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>Enter price and package size. Add a deal to automatically adjust the comparison price.</div>
            {stores.map(store=>{
              const entry=getPriceEntry(item,store.id)||{price:'',pkgQty:1,pkgUnit:item.unit||'count'};
              const rawUnit=entry.price&&entry.pkgQty?parseFloat(entry.price)/(parseFloat(entry.pkgQty)||1):null;
              const norm=rawUnit!=null?normalizeUnitPrice(rawUnit,entry.pkgUnit):null;
              const effectivePrice=entry.price?calcEffectivePrice(entry):null;
              const effectiveUnit=effectivePrice&&entry.pkgQty?effectivePrice/(parseFloat(entry.pkgQty)||1):null;
              const effectiveNorm=effectiveUnit!=null?normalizeUnitPrice(effectiveUnit,entry.pkgUnit):null;
              const isBest=best===store.id&&hasPrices;
              const deal=entry.deal||{};
              return(
                <div key={store.id} style={{
                  background:isBest?'var(--gdim)':'var(--surface)',
                  border:`1px solid ${isBest?'rgba(16,208,112,.3)':'var(--border)'}`,
                  borderRadius:9,padding:'10px 12px',marginBottom:8
                }}>
                  {/* Store header */}
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                    <a href={searchUrl(store,item.name)} target="_blank" rel="noopener"
                      style={{fontSize:13,fontWeight:700,color:'var(--blue)',textDecoration:'none',flex:1}}>
                      {store.icon} {store.name} →
                    </a>
                    {isBest&&<span className="tag tg" style={{fontSize:9}}>BEST DEAL</span>}
                  </div>

                  {/* Price + package row */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 70px 80px',gap:6,marginBottom:6}}>
                    <div><label style={{fontSize:9}}>Regular Price ($)</label>
                      <input type="number" min="0" step="0.01" placeholder="0.00" value={entry.price||''}
                        onChange={e=>savePrice(item.id,store.id,'price',e.target.value)} style={{padding:'5px 7px',fontSize:13}}/>
                    </div>
                    <div><label style={{fontSize:9}}>Pkg Size</label>
                      <input type="number" min="0.01" step="0.01" placeholder="1" value={entry.pkgQty||''}
                        onChange={e=>savePrice(item.id,store.id,'pkgQty',e.target.value)} style={{padding:'5px 7px',fontSize:13}}/>
                    </div>
                    <div><label style={{fontSize:9}}>Unit</label>
                      <select value={entry.pkgUnit||item.unit||'count'}
                        onChange={e=>savePrice(item.id,store.id,'pkgUnit',e.target.value)} style={{padding:'5px 7px',fontSize:12}}>
                        {UNITS.map(u=><option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Normal unit price */}
                  {norm&&entry.price>0&&<div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>
                    Regular: {friendlyBasePrice(norm.normalized,norm.base)}
                    {entry.pkgUnit&&entry.pkgUnit!==norm.base&&<span style={{fontSize:10,color:'var(--faint)',marginLeft:4}}>(from {entry.pkgUnit})</span>}
                  </div>}

                  {/* Deal section */}
                  <div style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:deal.type?8:0}}>
                      <span style={{fontSize:11,fontWeight:600,color:'var(--amber)',flexShrink:0}}>🏷 Deal</span>
                      <select value={deal.type||''} onChange={e=>savePrice(item.id,store.id,'deal.type',e.target.value)}
                        style={{flex:1,padding:'4px 6px',fontSize:11}}>
                        <option value="">— no deal —</option>
                        {DEAL_TYPES.map(d=><option key={d.v} value={d.v}>{d.l}</option>)}
                      </select>
                    </div>
                    {deal.type&&(<>
                      {deal.type!=='bogo'&&(
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:6}}>
                          <div><label style={{fontSize:9}}>{deal.type==='pct_off'?'% Off':deal.type==='amt_off'?'$ Off':'Bundle Price ($)'}</label>
                            <input type="number" min="0" step={deal.type==='pct_off'?'1':'0.01'} placeholder="0" value={deal.value||''}
                              onChange={e=>savePrice(item.id,store.id,'deal.value',e.target.value)} style={{padding:'5px 7px',fontSize:13}}/>
                            <div style={{fontSize:9,color:'var(--faint)',marginTop:2}}>{DEAL_TYPES.find(d=>d.v===deal.type)?.hint}</div>
                          </div>
                          <div><label style={{fontSize:9}}>Expires (optional)</label>
                            <input type="date" value={deal.expires||''} onChange={e=>savePrice(item.id,store.id,'deal.expires',e.target.value)}
                              style={{padding:'5px 7px',fontSize:12}}/>
                          </div>
                        </div>
                      )}
                      {deal.type==='bogo'&&(
                        <div style={{marginBottom:6}}><label style={{fontSize:9}}>Expires (optional)</label>
                          <input type="date" value={deal.expires||''} onChange={e=>savePrice(item.id,store.id,'deal.expires',e.target.value)}
                            style={{padding:'5px 7px',fontSize:12,width:'auto'}}/>
                        </div>
                      )}
                      {/* Deal result */}
                      {entry.price>0&&effectiveNorm&&(()=>{
                        const expired=deal.expires&&deal.expires<today();
                        return <div style={{padding:'5px 8px',background:expired?'var(--rdim)':'var(--adim)',borderRadius:6,fontSize:12}}>
                          {expired
                            ?<span style={{color:'var(--red)'}}>⚠️ Deal expired — using regular price</span>
                            :<span style={{color:isBest?'var(--green)':'var(--amber)',fontWeight:700}}>
                               With deal: {f$(effectivePrice,2)} → {friendlyBasePrice(effectiveNorm.normalized,effectiveNorm.base)}
                               {effectivePrice<parseFloat(entry.price)&&<span style={{fontWeight:400,marginLeft:4}}>(saves {f$(parseFloat(entry.price)-effectivePrice,2)})</span>}
                             </span>}
                        </div>;
                      })()}
                    </>)}
                  </div>
                </div>
              );
            })}

            {/* Summary */}
            {hasPrices&&best&&bestEntry&&bestNorm&&(
              <div style={{fontSize:12,color:'var(--green)',fontWeight:700,padding:'8px 10px',background:'var(--gdim)',borderRadius:6,marginTop:4}}>
                ✓ Best deal: {bestStoreName} at {friendlyBasePrice(bestNorm.normalized,bestNorm.base)}
                {(()=>{
                  const allNorm=Object.keys(item.prices).map(k=>{const e=getPriceEntry(item,k);if(!e||!e.price)return null;return getNormalizedUnitPrice(e)}).filter(v=>v!=null);
                  if(allNorm.length<2)return null;
                  const worst=Math.max(...allNorm);
                  const savings=worst-bestNorm.normalized;
                  return savings>0.0001?<span style={{color:'var(--muted)',fontWeight:400,marginLeft:6}}>· saves {friendlyBasePrice(savings,bestNorm.base)} vs most expensive</span>:null;
                })()}
              </div>
            )}
            <button className="btn btn-s sm" style={{marginTop:8}} onClick={()=>setEditingPrices(null)}>Done</button>
          </div>
        )}
      </div>);
    })}

    {/* Add item modal */}
    {showAdd&&<Modal title="Add to List" onClose={()=>setShowAdd(false)}>
      <div className="fr"><label>Item Name</label><input placeholder="e.g. Whole milk, Paper towels" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} autoFocus onKeyDown={e=>e.key==='Enter'&&addItem()}/></div>
      <div style={{display:'grid',gridTemplateColumns:'80px 1fr',gap:8,marginBottom:12}}>
        <div><label>Amount</label><input type="number" min="0" step="0.01" placeholder="2" value={form.qty} onChange={e=>setForm(f=>({...f,qty:e.target.value}))}/></div>
        <div><label>Unit</label><select value={form.unit} onChange={e=>setForm(f=>({...f,unit:e.target.value}))}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</select></div>
      </div>
      <div className="fr"><label>Notes</label><input placeholder="e.g. any brand, check sale" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-s" style={{flex:1}} onClick={()=>setShowAdd(false)}>Cancel</button>
        <button className="btn btn-p" style={{flex:2}} onClick={addItem} disabled={saving||!form.name.trim()}>{saving?<span className="spinner"/>:'Add to List'}</button>
      </div>
    </Modal>}

    {/* Store config modal */}
    {showConfig&&<Modal title="Manage Stores" onClose={()=>setShowConfig(false)}>
      <div style={{fontSize:12,color:'var(--muted)',marginBottom:14}}>Toggle stores on or off, or add any local store by name.</div>

      {/* Default stores */}
      <div style={{fontWeight:700,fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Common Stores</div>
      {DEFAULT_STORES.map(store=>{
        const on=activeStoreIds.includes(store.id);
        return(<div key={store.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:18}}>{store.icon}</span>
            <div><div style={{fontWeight:600,fontSize:13}}>{store.name}</div><div style={{fontSize:10,color:'var(--muted)'}}>{store.search.split('/')[2]}</div></div>
          </div>
          <button className={`btn sm ${on?'btn-p':'btn-s'}`} onClick={()=>toggleStore(store.id)}>{on?'✓ On':'Add'}</button>
        </div>);
      })}

      {/* Custom stores */}
      {customStores.length>0&&(<>
        <div style={{fontWeight:700,fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',margin:'14px 0 8px'}}>Your Stores</div>
        {customStores.map(store=>{
          const on=activeStoreIds.includes(store.id);
          return(<div key={store.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid var(--border)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:18}}>{store.icon}</span>
              <div><div style={{fontWeight:600,fontSize:13}}>{store.name}</div><div style={{fontSize:10,color:'var(--muted)'}}>Custom store</div></div>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className={`btn sm ${on?'btn-p':'btn-s'}`} onClick={()=>toggleStore(store.id)}>{on?'✓ On':'Add'}</button>
              <button className="btn btn-d sm" onClick={()=>deleteCustomStore(store.id)}>✕</button>
            </div>
          </div>);
        })}
      </>)}

      {/* Add custom store */}
      <div style={{fontWeight:700,fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',margin:'14px 0 8px'}}>Add a Store</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr',gap:8}}>
        <div className="fr" style={{margin:0}}><label>Store Name</label>
          <input placeholder="e.g. Aldi, Vinkiers, Fresh Thyme" value={newStore.name} onChange={e=>setNewStore(s=>({...s,name:e.target.value}))}/></div>
        <div className="fr" style={{margin:0}}><label>Website (optional — for search links)</label>
          <input placeholder="e.g. https://www.aldi.us/en/products/?q=" value={newStore.url} onChange={e=>setNewStore(s=>({...s,url:e.target.value}))}/>
          <div style={{fontSize:10,color:'var(--faint)',marginTop:3}}>Leave blank and we'll use Google search for price lookups instead.</div>
        </div>
        <button className="btn btn-p" onClick={addCustomStore} disabled={addingStore||!newStore.name.trim()}>{addingStore?<span className="spinner"/>:'Add Store'}</button>
      </div>
    </Modal>}
  </div>);
}


// ══════════════════════════════════════════════════════════════════
// SETTINGS TAB
// ══════════════════════════════════════════════════════════════════
function SettingsTab({user,profile,household,onSignOut}){
  const[copied,setCopied]=useState(false);
  function copyCode(){navigator.clipboard?.writeText(household?.invite_code||'').then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)})}
  return(<div>
    <div className="st">Settings</div>
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontWeight:700,marginBottom:12,fontSize:13}}>Your Account</div>
      <KV label="Name" val={profile?.name||'—'}/>
      <KV label="Email" val={user?.email||'—'}/>
      <div className="divider"/>
      <button className="btn btn-d" onClick={onSignOut}>Sign Out</button>
    </div>
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontWeight:700,marginBottom:5,fontSize:13}}>Household: {household?.name}</div>
      <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>Share this code with your partner to join your household.</div>
      <div className="invite-code" onClick={copyCode}>{household?.invite_code||'——————'}</div>
      <button className="btn btn-s btn-full" onClick={copyCode}>{copied?'✓ Copied!':'📋 Copy Invite Code'}</button>
    </div>
    <div className="card">
      <div style={{fontWeight:700,marginBottom:8,fontSize:13}}>About PocketPulse</div>
      <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.8}}><p>Data synced via Supabase, only visible to your household.</p><br/><p>Receipt scanning runs entirely on your device — images are never uploaded.</p></div>
    </div>
  </div>);
}

// ══════════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════════
function MainApp({user,profile,household}){
  const[tab,setTab]=useState('dashboard');
  const[debts,setDebts]=useState([]);const[transactions,setTransactions]=useState([]);
  const[budget,setBudget]=useState({income:0,expenses:[],paycheck_frequency:'biweekly',committed_strategy:null,committed_payment:0});
  const[kids,setKids]=useState([]);const[kidExpenses,setKidExpenses]=useState([]);
  const[showScanner,setShowScanner]=useState(false);const[loading,setLoading]=useState(true);
  const hid=household?.id;const uid2=user?.id;

  useEffect(()=>{
    if(!hid)return;
    Promise.all([
      apiFetchDebts(hid).then(setDebts),
      apiFetchTransactions(hid).then(setTransactions),
      apiFetchBudget(hid).then(d=>{if(d)setBudget({income:d.income||0,expenses:d.expenses||[],...d})}),
      apiFetchKids(hid).then(setKids),
      apiFetchKidExpenses(hid).then(setKidExpenses),
    ]).finally(()=>setLoading(false));
  },[hid]);

  useEffect(()=>{
    if(!sb||!hid)return;
    const ch=sb.channel(`hh-${hid}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'transactions',filter:`household_id=eq.${hid}`},(p)=>{if(p.new&&p.new.user_id!==uid2)setTransactions(prev=>[p.new,...prev])}).subscribe();
    return()=>sb.removeChannel(ch);
  },[hid,uid2]);

  async function signOut(){await sb.auth.signOut();window.location.reload()}
  function handleScanned(tx){setTransactions(prev=>[tx,...prev]);setShowScanner(false);setTab('transactions')}

  // 5 bottom nav tabs. "money" and "more" are meta-tabs with sub-navigation inside.
  const BNAV=[
    {id:'dashboard',icon:'🏠',short:'Home'},
    {id:'transactions',icon:'💳',short:'Spend'},
    {id:'money',icon:'📊',short:'Money'},
    {id:'debts',icon:'📋',short:'Debts'},
    {id:'more',icon:'☰',short:'More'},
  ];

  // money sub-tab state
  const[moneySub,setMoneySub]=useState('budget'); // budget | paycheck
  // more drawer state
  const[showMore,setShowMore]=useState(false);

  // Map "more" items to real tabs
  const MORE_ITEMS=[
    {id:'kids',icon:'👨‍👩‍👧‍👦',l:'Family Spending'},
    {id:'grocery',icon:'🛒',l:'Shopping List'},
    {id:'settings',icon:'⚙️',l:'Settings'},
  ];

  function handleBnav(id){
    if(id==='more'){setShowMore(s=>!s);return;}
    setShowMore(false);
    setTab(id);
  }

  function handleMoreItem(id){
    setShowMore(false);
    setTab(id);
  }

  // Which bnav item should appear active
  const activeBnav=
    tab==='budget'||tab==='paycheck'?'money':
    ['kids','grocery','settings'].includes(tab)?'more':
    tab;

  // All desktop nav tabs (header)
  const DESKTOP_TABS=[
    {id:'dashboard',l:'Dashboard'},{id:'transactions',l:'Spending'},
    {id:'budget',l:'Budget'},{id:'paycheck',l:'Paychecks'},
    {id:'debts',l:'Debts'},{id:'kids',l:'Family'},
    {id:'grocery',l:'Shopping'},{id:'settings',l:'Settings'},
  ];

  function renderTab(){
    if(loading)return<div style={{textAlign:'center',padding:60}}><div className="spinner" style={{width:32,height:32,borderWidth:3}}/><div style={{marginTop:14,color:'var(--muted)'}}>Loading...</div></div>;
    // Money tab renders budget or paycheck with a sub-tab toggle at top
    if(tab==='money')return(
      <div>
        <div style={{display:'flex',gap:6,marginBottom:16}}>
          <button className={`btn ${moneySub==='budget'?'btn-p':'btn-s'}`} style={{flex:1}} onClick={()=>setMoneySub('budget')}>📊 Budget</button>
          <button className={`btn ${moneySub==='paycheck'?'btn-p':'btn-s'}`} style={{flex:1}} onClick={()=>setMoneySub('paycheck')}>💰 Paychecks</button>
        </div>
        {moneySub==='budget'
          ?<BudgetTab budget={budget} setBudget={setBudget} householdId={hid} debts={debts} transactions={transactions} kids={kids} kidExpenses={kidExpenses}/>
          :<PaycheckTab budget={budget} setBudget={setBudget} householdId={hid} debts={debts}/>}
      </div>
    );
    switch(tab){
      case'dashboard':return<Dashboard debts={debts} transactions={transactions} budget={budget} kids={kids} kidExpenses={kidExpenses} userName={profile?.name}/>;
      case'transactions':return<TransactionsTab transactions={transactions} setTransactions={setTransactions} householdId={hid} userId={uid2} openScanner={()=>setShowScanner(true)} budget={budget} kids={kids} kidExpenses={kidExpenses} setKidExpenses={setKidExpenses}/>;
      case'budget':return<BudgetTab budget={budget} setBudget={setBudget} householdId={hid} debts={debts} transactions={transactions} kids={kids} kidExpenses={kidExpenses}/>;
      case'paycheck':return<PaycheckTab budget={budget} setBudget={setBudget} householdId={hid} debts={debts}/>;
      case'debts':return<DebtsTab debts={debts} setDebts={setDebts} householdId={hid} budget={budget} setBudget={setBudget} transactions={transactions} setTransactions={setTransactions} userId={uid2}/>;
      case'kids':return<FamilyTab kids={kids} setKids={setKids} kidExpenses={kidExpenses} setKidExpenses={setKidExpenses} householdId={hid} userId={uid2}/>;
      case'grocery':return<GroceryTab budget={budget} setBudget={setBudget} householdId={hid}/>;
      case'settings':return<SettingsTab user={user} profile={profile} household={household} onSignOut={signOut}/>;
    }
  }

  return(<div className="app">
    <div className="header">
      <div className="logo">PocketPulse 💸</div>
      <div className="nav">{DESKTOP_TABS.map(t=><button key={t.id} className={`nav-btn${tab===t.id?' active':''}`} onClick={()=>{setShowMore(false);setTab(t.id)}}>{t.l}</button>)}</div>
      <div className="huser"><div className="avatar" onClick={()=>setTab('settings')} title="Settings">{(profile?.name||user?.email||'?')[0].toUpperCase()}</div></div>
    </div>
    <div className="main" onClick={()=>showMore&&setShowMore(false)}>{renderTab()}</div>

    {/* More drawer — slides up above bottom nav */}
    {showMore&&(
      <div style={{position:'fixed',bottom:'calc(60px + env(safe-area-inset-bottom))',left:0,right:0,background:'var(--card)',border:'1px solid var(--border)',borderRadius:'16px 16px 0 0',padding:'12px 16px 8px',zIndex:199,boxShadow:'0 -4px 24px rgba(0,0,0,.4)'}}>
        <div style={{width:36,height:4,background:'var(--border)',borderRadius:2,margin:'0 auto 14px'}}/>
        {MORE_ITEMS.map(item=>(
          <button key={item.id} onClick={()=>handleMoreItem(item.id)} style={{display:'flex',alignItems:'center',gap:14,width:'100%',background:'none',border:'none',color:tab===item.id?'var(--green)':'var(--text)',padding:'12px 4px',borderBottom:'1px solid var(--border)',cursor:'pointer',fontSize:15,fontWeight:tab===item.id?700:500,fontFamily:'inherit'}}>
            <span style={{fontSize:22}}>{item.icon}</span>{item.l}
            {tab===item.id&&<span style={{marginLeft:'auto',color:'var(--green)',fontSize:12}}>✓</span>}
          </button>
        ))}
      </div>
    )}

    <div className="bottom-nav">
      <div className="bnav-items">
        {BNAV.map(t=>(<button key={t.id} className={`bnav-btn${(t.id==='more'?showMore:activeBnav===t.id)?' active':''}`} onClick={()=>handleBnav(t.id)}>
          <span className="bnav-icon">{t.icon}</span>
          <span>{t.short}</span>
        </button>))}
      </div>
    </div>
    {showScanner&&<ReceiptScanner householdId={hid} userId={uid2} onSaved={handleScanned} onClose={()=>setShowScanner(false)} budget={budget}/>}

  </div>);
}

// ══════════════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════════════
function Root(){
  const[authState,setAuthState]=useState('loading');
  const[user,setUser]=useState(null);const[profile,setProfile]=useState(null);const[household,setHousehold]=useState(null);
  useEffect(()=>{
    if(!IS_CFG){setAuthState('config');return}
    sb.auth.getSession().then(async({data:{session}})=>{if(!session){setAuthState('unauthed');return}await loadProfile(session.user)});
    const{data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){setAuthState('unauthed');setUser(null);setProfile(null);setHousehold(null)}});
    return()=>subscription.unsubscribe();
  },[]);
  async function loadProfile(u){
    setUser(u);const p=await apiGetProfile(u.id);
    if(!p){await apiUpsertProfile({id:u.id,email:u.email,name:u.email.split('@')[0]});setProfile({id:u.id,email:u.email,name:u.email.split('@')[0]});setAuthState('no-household');return}
    setProfile(p);if(!p.household_id){setAuthState('no-household');return}
    const h=await apiGetHousehold(p.household_id);setHousehold(h);setAuthState('ready');
  }
  function handleAuth(u){loadProfile(u)}
  async function handleHousehold(h){setHousehold(h);setAuthState('ready')}
  if(authState==='config')return<div className="auth-wrap"><div className="auth-box"><div className="auth-logo">PocketPulse</div><div className="auth-sub" style={{marginBottom:20}}>Open this file in a text editor and fill in your Supabase URL and anon key at the top of the script tag, then reload.</div></div></div>;
  if(authState==='loading')return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}><div className="spinner" style={{width:36,height:36,borderWidth:3}}/></div>;
  if(authState==='unauthed')return<AuthScreen onAuth={handleAuth}/>;
  if(authState==='no-household')return<HouseholdScreen user={user} onReady={handleHousehold}/>;
  return<MainApp user={user} profile={profile} household={household}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
