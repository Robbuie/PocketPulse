<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0d16">
<title>PocketPulse</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.26.0/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0d16;--surface:#111420;--card:#171c2e;--card2:#1e2438;--border:#252d47;--bl:#2e3858;
  --text:#dde4f5;--muted:#7a86a8;--faint:#3a4468;
  --green:#10d070;--gdim:rgba(16,208,112,.12);--gd2:rgba(16,208,112,.06);
  --red:#f05055;--rdim:rgba(240,80,85,.12);
  --blue:#6080f0;--bdim:rgba(96,128,240,.12);
  --amber:#f0a020;--adim:rgba(240,160,32,.12);
  --purple:#9878e8;--teal:#20c4b8;
  --mono:'Courier New',monospace;--r:10px;--rs:7px;
}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px)}
.logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px;white-space:nowrap;flex-shrink:0}
.huser{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer}
.nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:7px 11px;border-radius:var(--rs);font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.nav-btn:hover{color:var(--text);background:var(--card)}
.nav-btn.active{color:var(--green);background:var(--gdim)}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 0 calc(4px + env(safe-area-inset-bottom));z-index:200}
.bnav-items{display:flex;justify-content:space-around}
.bnav-btn{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;font-size:9px;font-weight:600;transition:color .15s;letter-spacing:.2px;min-width:0;flex:1}
.bnav-btn.active{color:var(--green)}
.bnav-icon{font-size:17px;line-height:1}
@media(max-width:700px){.bottom-nav{display:block}.nav{display:none}.main{padding-bottom:calc(68px + env(safe-area-inset-bottom))}}
.main{flex:1;padding:16px;max-width:1100px;margin:0 auto;width:100%}
.st{font-size:17px;font-weight:700;margin-bottom:16px}
.st-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.st-row .st{margin-bottom:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}.hide-sm{display:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.mlabel{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;margin-bottom:4px}
.mval{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-.5px}
.msub{font-size:11px;color:var(--muted);margin-top:2px}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.amber{color:var(--amber)}.muted{color:var(--muted)}.teal{color:var(--teal)}.mono{font-family:var(--mono)}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:9px 11px;font-size:14px;outline:none;transition:border-color .15s;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
select option{background:var(--surface)}
textarea{resize:vertical;min-height:70px}
.fr{margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:480px){.fg,.fg3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn-p{background:var(--green);color:#030a04;border-color:var(--green)}.btn-p:hover{background:#0ec060}
.btn-s{background:var(--card);color:var(--text);border-color:var(--bl)}.btn-s:hover{border-color:var(--blue);color:var(--blue)}
.btn-d{background:transparent;color:var(--red);border-color:#4a2020}.btn-d:hover{background:var(--rdim)}
.btn-b{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-b:hover{background:#4a6ae0}
.btn-a{background:var(--amber);color:#0a0600;border-color:var(--amber)}
.btn-full{width:100%}.sm{padding:5px 10px;font-size:12px}
.brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.kv-label{font-size:12px;color:var(--muted)}.kv-val{font-size:14px;font-weight:700;font-family:var(--mono)}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px}
.tg{background:var(--gdim);color:var(--green)}.tb{background:var(--bdim);color:var(--blue)}
.tr2{background:var(--rdim);color:var(--red)}.ta{background:var(--adim);color:var(--amber)}
.tp{background:rgba(152,120,232,.12);color:var(--purple)}.tt{background:rgba(32,196,184,.12);color:var(--teal)}
.tgr{background:rgba(122,134,168,.1);color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.cgrid{grid-template-columns:1fr}}
.chwrap{position:relative;height:200px;width:100%}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:10px}
.alert{padding:11px 13px;border-radius:var(--rs);font-size:13px;margin-bottom:14px}
.alert-err{background:var(--rdim);border:1px solid rgba(240,80,85,.3);color:var(--red)}
.alert-ok{background:var(--gdim);border:1px solid rgba(16,208,112,.3);color:var(--green)}
.alert-info{background:var(--bdim);border:1px solid rgba(96,128,240,.3);color:var(--blue)}
.alert-warn{background:var(--adim);border:1px solid rgba(240,160,32,.3);color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:580px;padding:22px;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:16px}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.tx-item{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;transition:border-color .15s}
.tx-item:hover{border-color:var(--bl)}
.tx-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--muted);margin-top:1px}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap}
.di{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;transition:border-color .15s}
.di:hover{border-color:var(--bl)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dinfo{flex:1;min-width:0}
.dname{font-weight:600;font-size:13px}
.pgbar-wrap{background:var(--surface);border-radius:4px;height:5px;overflow:hidden;margin-top:6px}
.pgbar-fill{height:100%;border-radius:4px;transition:width .5s}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px}
.auth-logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:5px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-switch{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.auth-switch span{color:var(--green);cursor:pointer;font-weight:600}
.scan-area{border:2px dashed var(--border);border-radius:var(--r);padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.scan-area:hover{border-color:var(--green);background:var(--gd2)}
.scan-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ocr-prog{background:var(--surface);border-radius:8px;height:7px;overflow:hidden;margin:10px 0}
.ocr-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--teal));border-radius:8px;transition:width .3s}
.item-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.item-row input{flex:1}
.item-row .price-in{width:85px;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.invite-code{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:4px;color:var(--green);text-align:center;padding:18px;background:var(--gdim);border:1px solid rgba(16,208,112,.2);border-radius:var(--r);margin:10px 0;cursor:pointer;user-select:all}

/* ── Paycheck Planner ── */
.pc-card{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.pc-card.current{border-color:var(--green)}
.pc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pc-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.pc-date{font-size:15px;font-weight:700}
.pc-amount{font-family:var(--mono);font-size:18px;font-weight:800;color:var(--green)}
.pc-bill{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:10px}
.pc-bill:last-child{border-bottom:none}
.pc-bill-name{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-bill-due{font-size:11px;color:var(--muted);white-space:nowrap;margin-right:8px}
.pc-bill-amt{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.pc-remaining{margin-top:12px;padding:10px 12px;background:var(--card);border-radius:8px;display:flex;justify-content:space-between;align-items:center}

/* ── Quick Extras ── */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.quick-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;font-family:inherit}
.quick-btn:hover,.quick-btn.selected{border-color:var(--blue);background:var(--bdim)}
.quick-btn .qb-icon{font-size:22px;margin-bottom:4px}
.quick-btn .qb-label{font-size:11px;font-weight:600;color:var(--muted)}

/* ── Kids Tracker ── */
.kid-card{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.kid-card:hover{border-color:var(--bl)}
.kid-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.kid-spend{font-family:var(--mono);font-size:17px;font-weight:800}
.ke-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:7px}

/* ── Cash flow timeline ── */
.cf-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-left:3px solid;border-radius:0 9px 9px 0;background:var(--surface);margin-bottom:6px}
.cf-day{font-size:11px;font-weight:700;color:var(--muted);width:32px;flex-shrink:0}
.cf-name{font-size:13px;font-weight:600;flex:1;min-width:0}
.cf-tag{font-size:10px;color:var(--muted)}
.cf-amt{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}

/* ── Committed plan badge ── */
.commit-badge{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--gdim);border:1px solid rgba(16,208,112,.25);border-radius:10px;margin-bottom:14px}
/* ── Budget vs actual bar ── */
.bva-row{padding:9px 0;border-bottom:1px solid var(--border)}
.bva-row:last-child{border-bottom:none}
.bva-labels{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.bva-name{font-size:13px;font-weight:600}
.bva-nums{font-size:11px;color:var(--muted);display:flex;gap:12px}
.bva-track{background:var(--surface);border-radius:3px;height:5px;overflow:hidden}
.bva-fill{height:100%;border-radius:3px;transition:width .4s}
/* ── Item history ── */
.item-hist{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:7px}
.item-hist-name{font-weight:600;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-hist-meta{font-size:11px;color:var(--muted);margin-top:1px}
/* ── Variable badge ── */
.var-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;background:var(--adim);border-radius:3px;font-size:9px;font-weight:700;color:var(--amber);letter-spacing:.3px}
/* ── Source picker ── */
.src-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;font-family:inherit;flex:1}
.src-btn:hover,.src-btn.active{border-color:var(--blue);background:var(--bdim)}
.src-icon{font-size:28px;line-height:1}
.src-label{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
/* ── Receipt item table ── */
.ri-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.ri-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.ri-table td{padding:5px 5px;border-bottom:1px solid var(--border);vertical-align:middle}
.ri-table tr:last-child td{border-bottom:none}
.ri-table tr.excluded td{opacity:.4}
.ri-table input[type=text],.ri-table input[type=number]{padding:5px 7px;font-size:12px}
.ri-table select{padding:4px 6px;font-size:11px}
.ri-check{width:16px;height:16px;cursor:pointer;accent-color:var(--green)}
/* ── Budget line pill ── */
.bl-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;background:var(--bdim);border-radius:4px;font-size:10px;font-weight:700;color:var(--blue);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── Transaction edit modal ── */
.tx-edit-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.tx-edit-row:last-child{border-bottom:none}
/* ── Shopping List ── */
.shop-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;transition:all .15s}
.shop-item.checked{opacity:.45}
.shop-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .15s;font-size:13px}
.shop-check.done{background:var(--green);border-color:var(--green);color:#030a04}
.shop-name{font-weight:600;font-size:14px}
.shop-name.struck{text-decoration:line-through;color:var(--muted)}
.shop-meta{font-size:11px;color:var(--muted);margin-top:2px}
.price-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.price-chip{display:flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:all .15s;text-decoration:none}
.price-chip:hover{border-color:var(--blue)}
.price-chip.best{border-color:var(--green);background:var(--gdim)}
.price-chip .pc-store{font-size:10px;color:var(--muted)}
.price-chip .pc-price{font-family:var(--mono);font-size:12px;font-weight:700}
.price-chip.best .pc-price{color:var(--green)}
</style>

// How many paychecks per month for a given frequency
function checksPerMonth(freq){
  if(freq==='weekly')return 52/12;
  if(freq==='biweekly')return 26/12;
  if(freq==='semimonthly')return 2;
  return 1;
}
// Monthly equivalent of a single check amount
function monthlyFromSource(src){
  return(parseFloat(src.amount)||0)*checksPerMonth(src.frequency||'biweekly');
}
// Total monthly income across all income sources
function totalMonthlyIncome(sources){
  return(sources||[]).reduce((s,src)=>s+monthlyFromSource(src),0);
}
// Get all upcoming pay dates across multiple sources, merged and sorted
function getAllPayDates(sources,count=10){
  const all=[];
  for(const src of (sources||[])){
    if(!src.next_date||!src.amount)continue;
    const dates=getPayDates(src.frequency||'biweekly',src.next_date,count);
    for(const d of dates)all.push({date:d,source:src});
  }
  return all.sort((a,b)=>a.date-b.date);
}

// ── Math ─────────────────────────────────────────────────────────
function amortize(balance,annualRate,monthlyPayment,extra=0){
  const r=(parseFloat(annualRate)||0)/100/12;
  const pmt=(parseFloat(monthlyPayment)||0)+(parseFloat(extra)||0);
  let rem=Math.abs(parseFloat(balance)||0);
  if(rem<=0)return{schedule:[],totalInterest:0,months:0};
  if(pmt<=0||(r>0&&pmt<rem*r+0.01))return{schedule:[],totalInterest:0,months:Infinity};
  let ti=0;const s=[];
  for(let mo=1;mo<=600;mo++){
    const int=rem*r,ap=Math.min(pmt,rem+int),pr=ap-int;
    rem=Math.max(0,rem-pr);ti+=int;
    s.push({month:mo,payment:ap,interest:int,principal:pr,balance:rem,totalInterest:ti});
    if(rem<0.01)break;
  }
  return{schedule:s,totalInterest:ti,months:s.length};
}

// Get the most recent due date that has already passed for a debt
function getLastDueDate(dueDay){
  if(!dueDay)return null;
  const now=new Date();now.setHours(0,0,0,0);
  let d=new Date(now.getFullYear(),now.getMonth(),parseInt(dueDay));
  d.setHours(0,0,0,0);
  if(d>now)d.setMonth(d.getMonth()-1);
  return d.toISOString().slice(0,10);
}

// Calculate daily interest accrued on a balance since a given date
function calcDebtInterest(balance,apr,sinceDate){
  const bal=parseFloat(balance)||0;
  const rate=parseFloat(apr)||0;
  if(!rate||!bal||!sinceDate)return{accrued:0,daysSince:0,currentTotal:bal};
  const dailyRate=rate/100/365;
  const since=new Date(sinceDate+'T00:00:00');
  const now=new Date();now.setHours(0,0,0,0);
  const daysSince=Math.max(0,Math.floor((now-since)/86400000));
  const accrued=bal*dailyRate*daysSince;
  return{accrued,daysSince,currentTotal:bal+accrued,dailyRate};
}

// Split a payment into interest and principal portions (simple monthly interest)
function splitPayment(paymentAmt,balance,apr){
  const monthlyInterest=(parseFloat(balance)||0)*((parseFloat(apr)||0)/100/12);
  const interestPortion=Math.min(parseFloat(paymentAmt)||0,monthlyInterest);
  const principalPortion=Math.max(0,(parseFloat(paymentAmt)||0)-interestPortion);
  const newBalance=Math.max(0,(parseFloat(balance)||0)-principalPortion);
  return{interestPortion,principalPortion,newBalance,monthlyInterest};
}
function simulatePayoff(debtsIn,extra,strategy){
  if(!debtsIn?.length)return{months:0,totalInterest:0,payoffOrder:[],monthlyTotal:0};
  let debts=debtsIn.map(d=>({
    id:d.id,name:d.name,
    remaining:Math.max(0,parseFloat(d.balance)||0),
    rate:parseFloat(d.rate)||0,
    minPmt:Math.max(1,parseFloat(d.min_payment||d.minPayment)||0),
    paidOff:false,paidOffMonth:null
  })).filter(d=>d.remaining>0);
  if(!debts.length)return{months:0,totalInterest:0,payoffOrder:[],monthlyTotal:0};
  const totalMin=debts.reduce((s,d)=>s+d.minPmt,0);
  let month=0,ti=0,bonus=parseFloat(extra)||0;
  while(debts.some(d=>!d.paidOff)&&month<600){
    month++;
    const unpaid=debts.filter(d=>!d.paidOff);
    const sorted=[...unpaid].sort((a,b)=>strategy==='avalanche'?b.rate-a.rate:a.remaining-b.remaining);
    const targetId=sorted[0].id;
    for(const d of unpaid){
      const r=d.rate/100/12;
      const int=d.remaining*r;
      ti+=int;
      const isT=d.id===targetId;
      const pmt=isT?Math.min(d.minPmt+bonus,d.remaining+int):Math.min(d.minPmt,d.remaining+int);
      const pr=Math.max(0,pmt-int);
      d.remaining=Math.max(0,d.remaining-pr);
      if(d.remaining<0.01&&!d.paidOff){d.paidOff=true;d.paidOffMonth=month;bonus+=d.minPmt}
    }
  }
  return{months:month,totalInterest:ti,monthlyTotal:totalMin+(parseFloat(extra)||0),payoffOrder:debts.filter(d=>d.paidOffMonth).sort((a,b)=>a.paidOffMonth-b.paidOffMonth)};
}

function guessItemBudgetLine(itemName,budgetExpenses){
  if(!itemName||!budgetExpenses?.length)return null;
  const name=itemName.toLowerCase();
  // keyword groups → hints
  const hints=[
    {words:['gas','fuel','unleaded','diesel','gallon','87','89','93'],hints:['gas','fuel','transport']},
    {words:['milk','bread','egg','cheese','meat','chicken','beef','pork','produce','veggie','fruit','grocery','grocer','cereal','butter','cream','flour','sugar','pasta','rice'],hints:['grocery','food','grocer']},
    {words:['restaurant','pizza','burger','taco','sandwich','sub','coffee','latte','espresso','donut','bakery','dining'],hints:['dining','food','restaurant','coffee']},
    {words:['medicine','prescription','vitamin','supplement','pharmacy','rx'],hints:['health','medical','pharmacy']},
    {words:['amazon','shipping','online','prime'],hints:['shop','amazon']},
    {words:['electric','water','gas bill','internet','cable','phone bill','utility'],hints:['utility','electric','internet']},
    {words:['insurance','premium','policy'],hints:['insurance']},
    {words:['school','tuition','book','supply','pencil','backpack'],hints:['school','education']},
    {words:['clothes','shirt','pants','shoes','jacket','dress'],hints:['cloth','wear','apparel']},
  ];
  for(const g of hints){
    if(g.words.some(w=>name.includes(w))){
      // find budget expense whose label/category contains any of the hints
      const match=budgetExpenses.find(e=>{
        const lbl=(e.label||'').toLowerCase()+(e.category||'').toLowerCase();
        return g.hints.some(h=>lbl.includes(h));
      });
      if(match)return match.id;
    }
  }
  return null;
}
function checksPerPeriod(frequency){
  // Returns how many paychecks per month on average
  const map={weekly:52/12,biweekly:26/12,semimonthly:2,monthly:1};
  return map[frequency]||2;
}
function varAmtPerCheck(monthlyAmt,frequency){
  return (parseFloat(monthlyAmt)||0)/checksPerPeriod(frequency);
}

// ── Rolling category averages from transactions ──────────────────
function rollingAvgByCategory(transactions,numMonths=3){
  if(!transactions.length)return{};
  const now=new Date();
  const months={};
  for(let i=0;i<numMonths;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months[d.toISOString().slice(0,7)]=true;
  }
  const byMonthCat={};
  for(const t of transactions){
    const m=t.date?.slice(0,7);
    if(!m||!months[m])continue;
    const c=t.category||'🧾 Other';
    if(!byMonthCat[c])byMonthCat[c]={};
    byMonthCat[c][m]=(byMonthCat[c][m]||0)+(parseFloat(t.amount)||0);
  }
  const avgs={};
  for(const[cat,byMonth] of Object.entries(byMonthCat)){
    const vals=Object.values(byMonth);
    avgs[cat]=vals.reduce((s,v)=>s+v,0)/numMonths;
  }
  return avgs;
}

// ── Item purchase history from receipt items ─────────────────────
function buildItemHistory(transactions){
  const map={};
  for(const t of transactions){
    if(!t.items?.length)continue;
    for(const item of t.items){
      const key=(item.name||'').toLowerCase().trim();
      if(!key||key.length<2)continue;
      if(!map[key])map[key]={name:item.name,times:0,totalPrice:0,lastDate:'',lastMerchant:'',merchants:new Set()};
      map[key].times++;
      map[key].totalPrice+=(parseFloat(item.price)||0);
      if(!map[key].lastDate||t.date>map[key].lastDate){map[key].lastDate=t.date;map[key].lastMerchant=t.merchant||'';}
      if(t.merchant)map[key].merchants.add(t.merchant);
    }
  }
  return Object.values(map).map(i=>({...i,merchants:[...i.merchants],avgPrice:i.totalPrice/i.times})).sort((a,b)=>b.lastDate.localeCompare(a.lastDate));
}
function getPayDates(frequency,nextDateStr,count=8){
  if(!nextDateStr)return[];
  const dates=[];
  let d=new Date(nextDateStr+'T00:00:00');
  for(let i=0;i<count;i++){
    dates.push(new Date(d));
    if(frequency==='weekly')d.setDate(d.getDate()+7);
    else if(frequency==='biweekly')d.setDate(d.getDate()+14);
    else if(frequency==='semimonthly'){
      if(d.getDate()<15){d.setDate(15)}
      else{d.setMonth(d.getMonth()+1);d.setDate(1)}
    }else{d.setMonth(d.getMonth()+1)}
  }
  return dates;
}

function getBillsInPeriod(expenses,debts,startDate,endDate,committedPayment){
  const items=[];
  const start=new Date(startDate);start.setHours(0,0,0,0);
  const end=new Date(endDate);end.setHours(0,0,0,0);
  let cur=new Date(start);
  const seen=new Set();
  while(cur<end){
    const day=cur.getDate();
    const key=`${cur.getFullYear()}-${cur.getMonth()}`;
    for(const e of (expenses||[])){
      if(parseInt(e.due_day)===day&&!seen.has('e'+e.id+key)){
        seen.add('e'+e.id+key);
        items.push({id:'e'+e.id,name:e.label||e.category,amount:parseFloat(e.amount)||0,due:new Date(cur),type:'expense',color:CAT_COLORS[e.category]||'var(--amber)'});
      }
    }
    for(const d of (debts||[])){
      if(parseInt(d.due_day)===day&&!seen.has('d'+d.id+key)){
        seen.add('d'+d.id+key);
        items.push({id:'d'+d.id,name:d.name,amount:parseFloat(d.min_payment)||0,due:new Date(cur),type:'debt',color:getType(d.type).c});
      }
    }
    cur.setDate(cur.getDate()+1);
  }
  if(committedPayment>0){
    // Add payoff plan as first-of-period item if not already covered by debt minimums
    const debtMins=(debts||[]).filter(d=>d.due_day).reduce((s,d)=>s+(parseFloat(d.min_payment)||0),0);
    const extra=committedPayment-debtMins;
    if(extra>0.5){
      items.push({id:'plan',name:'💡 Extra Debt Payoff',amount:extra,due:new Date(start),type:'plan',color:'var(--green)'});
    }
  }
  return items.sort((a,b)=>a.due-b.due);
}

function getCashFlow(expenses,debts,committedPayment,days=60){
  const items=[];
  const now=new Date();now.setHours(0,0,0,0);
  for(let i=0;i<days;i++){
    const d=new Date(now);d.setDate(d.getDate()+i);
    const day=d.getDate();
    for(const e of (expenses||[])){
      if(parseInt(e.due_day)===day){
        items.push({name:e.label||e.category,amount:parseFloat(e.amount)||0,date:new Date(d),type:'expense',color:'var(--amber)'});
      }
    }
    for(const debt of (debts||[])){
      if(parseInt(debt.due_day)===day){
        items.push({name:debt.name,amount:parseFloat(debt.min_payment)||0,date:new Date(d),type:'debt',color:getType(debt.type).c});
      }
    }
  }
  return items.sort((a,b)=>a.date-b.date);
}

// ── Receipt text parser ──────────────────────────────────────────
function parseReceiptText(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const items=[];let total=0,merchant=lines[0]||'Receipt',tax=0;
  const priceRe=/^(.+?)\s+\$?(\d{1,4}\.\d{2})\s*$/;
  const skipRe=/\b(tax|subtotal|sub total|change|cash|credit|debit|thank|visit|receipt|auth|appr|ref|trans|item|qty|number)\b/i;
  for(const line of lines){
    const m=line.match(priceRe);if(!m)continue;
    const name=m[1].trim();const price=parseFloat(m[2]);
    if(price<=0||price>999)continue;
    if(/\btotal\b/i.test(name)){total=price;continue}
    if(/\btax\b/i.test(name)){tax=price;continue}
    if(skipRe.test(name))continue;
    items.push({id:uid(),name,price});
  }
  if(!total&&items.length)total=items.reduce((s,i)=>s+i.price,0)+tax;
  for(let i=0;i<Math.min(5,lines.length);i++){if(!/\d/.test(lines[i])&&lines[i].length>2){merchant=lines[i];break}}
  return{merchant,items,total:parseFloat(total.toFixed(2)),tax};
}

    {err&&<div className="alert alert-err">{err}</div>}

    <div className="fr"><label>Email</label><input type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
    <div className="fr"><label>Password</label><input type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
    <button className="btn btn-p btn-full" onClick={submit} disabled={loading}>{loading?<span className="spinner"/>:mode==='login'?'Sign In':'Create Account'}</button>
    <div className="auth-switch">{mode==='login'?<>No account? <span onClick={()=>{setMode('signup');setErr('')}}>Sign up free</span></>:<>Have an account? <span onClick={()=>{setMode('login');setErr('')}}>Sign in</span></>}</div>
  </div></div>);
}

function HouseholdScreen({user,onReady}){
  const[mode,setMode]=useState('create');
  const[houseName,setHouseName]=useState('');const[inviteCode,setInviteCode]=useState('');
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  async function create(){
    if(!houseName.trim()){setErr('Enter a household name');return}
    setLoading(true);setErr('');
    const{data,error}=await apiCreateHousehold(houseName.trim(),user.id);
    if(error){setErr(error.message);setLoading(false);return}
    await apiUpsertProfile({id:user.id,email:user.email,household_id:data.id});
    onReady(data);setLoading(false);
  }
  async function join(){
    if(!inviteCode.trim()){setErr('Enter an invite code');return}
    setLoading(true);setErr('');
    const{data,error}=await apiJoinHousehold(inviteCode);
    if(error||!data){setErr('Invite code not found.');setLoading(false);return}
    await apiUpsertProfile({id:user.id,email:user.email,household_id:data.id});
    onReady(data);setLoading(false);
  }
  return(<div className="auth-wrap"><div className="auth-box" style={{maxWidth:460}}>
    <div className="auth-logo">Set Up Your Household 🏡</div>
    <div className="auth-sub">Create a shared household to track finances together.</div>
    {err&&<div className="alert alert-err">{err}</div>}
    <div style={{display:'flex',gap:8,marginBottom:18}}>
      {['create','join'].map(m=><button key={m} className={`btn ${mode===m?'btn-p':'btn-s'}`} style={{flex:1}} onClick={()=>{setMode(m);setErr('')}}>{m==='create'?'Create New':'Join Existing'}</button>)}
    </div>
    {mode==='create'?(<>
      <div className="fr"><label>Household Name</label><input placeholder="e.g. The Johnson House" value={houseName} onChange={e=>setHouseName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&create()}/></div>
      <button className="btn btn-p btn-full" onClick={create} disabled={loading}>{loading?<span className="spinner"/>:'Create Household'}</button>
    </>):(<>
      <div className="fr"><label>Invite Code</label><input placeholder="e.g. AB12CD34" value={inviteCode} onChange={e=>setInviteCode(e.target.value.toUpperCase())} style={{fontFamily:'var(--mono)',letterSpacing:2,fontSize:18}}/></div>
      <button className="btn btn-p btn-full" onClick={join} disabled={loading}>{loading?<span className="spinner"/>:'Join Household'}</button>
    </>)}
  </div></div>);
}

// DASHBOARD
// ══════════════════════════════════════════════════════════════════
function Dashboard({debts,transactions,budget,kids,kidExpenses,userName}){
  const totalDebt=debts.reduce((s,d)=>s+(parseFloat(d.balance)||0),0);
  // Income: prefer income_sources derived total, fall back to manual budget.income
  const incomeSources=budget.income_sources||[];
  const income=incomeSources.length>0?totalMonthlyIncome(incomeSources):(parseFloat(budget.income)||0);
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthTx=transactions.filter(t=>t.date?.startsWith(thisMonth));
  const monthSpend=monthTx.reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
  const monthKidSpend=kidExpenses.filter(k=>k.date?.startsWith(thisMonth)).reduce((s,k)=>s+(parseFloat(k.amount)||0),0);
  // "Left this month" = income minus everything actually spent (including logged debt payments)
  const netActual=income-monthSpend-monthKidSpend;
  const recent=transactions.slice(0,4);
  const chartRef=useRef(null);const chartInst=useRef(null);
  const catSpend=useMemo(()=>{
    const map={};
    for(const t of monthTx){const c=t.category||'🧾 Other';map[c]=(map[c]||0)+(parseFloat(t.amount)||0);}
    // Include kid expenses as their own categories
    for(const ke of (kidExpenses||[]).filter(k=>k.date?.startsWith(thisMonth))){
      const c=ke.category||'👨‍👩‍👧‍👦 Family';map[c]=(map[c]||0)+(parseFloat(ke.amount)||0);
    }
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  },[monthTx,kidExpenses,thisMonth]);
  useEffect(()=>{
    if(!chartRef.current||!catSpend.length)return;
    if(chartInst.current)chartInst.current.destroy();
    chartInst.current=new Chart(chartRef.current,{type:'doughnut',data:{labels:catSpend.map(([c])=>c),datasets:[{data:catSpend.map(([,v])=>v),backgroundColor:catSpend.map(([c])=>CAT_COLORS[c]||'#7a86a8'),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'68%'}});
    return()=>{if(chartInst.current)chartInst.current.destroy()};
  },[catSpend]);

  return(<div>
    <div style={{marginBottom:18}}><div style={{fontSize:20,fontWeight:800}}>Hey{userName?`, ${userName.split(' ')[0]}`:''}! 👋</div><div style={{fontSize:13,color:'var(--muted)'}}>Here's your financial pulse.</div></div>
    <div className="grid g4" style={{marginBottom:14}}>
      {[{label:'Total Debt',val:f$(totalDebt),color:'var(--red)'},{label:'Spent This Month',val:f$(monthSpend+monthKidSpend),color:'var(--amber)'},{label:'Left This Month',val:income>0?f$(netActual):'-',color:netActual>=0?'var(--green)':'var(--red)'},{label:'Family Spending',val:f$(monthKidSpend),color:'var(--purple)'}].map(m=>(<div key={m.label} className="mcard"><div className="mlabel">{m.label}</div><div className="mval" style={{color:m.color,fontSize:19}}>{m.val}</div></div>))}
    </div>
    {budget.committed_strategy&&<div className="commit-badge"><span style={{fontSize:20}}>✅</span><div><div style={{fontWeight:700,fontSize:13}}>Committed to {budget.committed_strategy==='avalanche'?'Avalanche':'Snowball'} Plan</div><div style={{fontSize:12,color:'var(--muted)'}}>Paying {f$(committed,2)}/mo toward debt · included in budget above</div></div></div>}
    <div className="cgrid" style={{marginBottom:14}}>
      <div className="card">
        <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>This Month's Spending</div>
        {catSpend.length?(<><div className="chwrap"><canvas ref={chartRef}/></div><div style={{marginTop:10}}>{catSpend.map(([cat,amt])=>(<div key={cat} className="kv" style={{padding:'4px 0'}}><span style={{fontSize:12}}>{cat}</span><span style={{fontFamily:'var(--mono)',fontSize:12,color:CAT_COLORS[cat]||'var(--muted)'}}>{f$(amt,2)}</span></div>))}</div></>):<div className="empty"><div className="empty-icon">📊</div><p>No spending logged yet.</p></div>}
      </div>
      <div className="card">
        <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>Recent Transactions</div>
        {recent.length?recent.map(t=>(<div key={t.id} className="tx-item"><div className="tx-icon" style={{background:`${CAT_COLORS[t.category]||'var(--bl)'}22`}}>{catIcon(t.category||'Other')}</div><div className="tx-info"><div className="tx-name">{t.merchant||t.description||t.category}</div><div className="tx-meta">{fshort(t.date)}</div></div><div className="tx-amt red">-{f$(t.amount,2)}</div></div>)):<div className="empty" style={{padding:24}}><div className="empty-icon">🧾</div><p>No transactions yet.</p></div>}
      </div>
    </div>
    {kids.length>0&&<div className="card"><div style={{fontWeight:700,marginBottom:10,fontSize:13}}>Family Spending This Month</div><div style={{display:'flex',gap:10,flexWrap:'wrap'}}>{kids.map(kid=>{const spend=kidExpenses.filter(ke=>ke.kid_id===kid.id&&ke.date?.startsWith(thisMonth)).reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0);return(<div key={kid.id} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:9,padding:'10px 14px',minWidth:100}}><div style={{fontSize:22,marginBottom:4}}>{kid.emoji||'👤'}</div><div style={{fontWeight:600,fontSize:13}}>{kid.name}</div><div style={{fontFamily:'var(--mono)',fontSize:15,color:kid.color||'var(--purple)',fontWeight:800}}>{f$(spend,2)}</div></div>)})}</div></div>}
  </div>);
}
