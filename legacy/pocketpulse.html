// TRANSACTIONS TAB
// ══════════════════════════════════════════════════════════════════
function TransactionsTab({transactions,setTransactions,householdId,userId,openScanner,budget,kids,kidExpenses,setKidExpenses}){
  const[view,setView]=useState('list');
  const[mode,setMode]=useState('list');
  const[filter,setFilter]=useState('all');const[search,setSearch]=useState('');
  const[itemSearch,setItemSearch]=useState('');
  const[form,setForm]=useState({amount:'',category:CATS[1],budget_line_id:'',merchant:'',description:'',date:today()});
  const[quickCat,setQuickCat]=useState(null);const[quickAmt,setQuickAmt]=useState('');const[quickNote,setQuickNote]=useState('');
  const[saving,setSaving]=useState(false);const[deleting,setDeleting]=useState(null);
  const[editing,setEditing]=useState(null);
  const[editForm,setEditForm]=useState(null);
  const budgetExpenses=budget?.expenses||[];

  // Merge kid expenses into unified display list
  const mergedItems=useMemo(()=>{
    const txItems=(transactions||[]).map(t=>({...t,_type:'tx'}));
    const kidItems=(kidExpenses||[]).map(ke=>{
      const kid=(kids||[]).find(k=>k.id===ke.kid_id);
      return{
        id:ke.id,_type:'family',
        amount:ke.amount,date:ke.date,
        merchant:kid?kid.name:'Family',
        description:ke.description||ke.category,
        category:ke.category,
        _kidColor:kid?.color||'var(--purple)',
        _kidEmoji:kid?.emoji||'👨‍👩‍👧‍👦',
        _kidName:kid?.name||'Family',
      };
    });
    return[...txItems,...kidItems].sort((a,b)=>new Date(b.date)-new Date(a.date)||new Date(b.created_at||0)-new Date(a.created_at||0));
  },[transactions,kidExpenses,kids]);

  async function deleteFamilyItem(id){
    setDeleting(id);
    const{error}=await apiDeleteKidExpense(id);
    if(!error)setKidExpenses(prev=>prev.filter(ke=>ke.id!==id));
    setDeleting(null);
  }

  function openEdit(tx){
    setEditing(tx);
    setEditForm({
      amount:tx.amount||'',
      category:tx.category||CATS[1],
      budget_line_id:tx.budget_line_id||'',
      merchant:tx.merchant||'',
      description:tx.description||'',
      date:tx.date||today(),
      items:(tx.items||[]).map(i=>({...i,budget_line_id:i.budget_line_id||'',included:i.included!==false})),
    });
  }

  async function saveEdit(){
    if(!editForm||!editing)return;setSaving(true);
    const updates={
      amount:parseFloat(editForm.amount)||0,
      category:editForm.category,
      budget_line_id:editForm.budget_line_id||null,
      merchant:editForm.merchant,
      description:editForm.description,
      date:editForm.date,
      items:editForm.items,
    };
    const{data,error}=await apiUpdateTransaction(editing.id,updates);
    if(!error&&data)setTransactions(prev=>prev.map(t=>t.id===editing.id?data:t));
    setEditing(null);setEditForm(null);setSaving(false);
  }

  function updateEditItem(id,field,val){
    setEditForm(f=>({...f,items:f.items.map(i=>i.id===id?{...i,[field]:field==='price'?parseFloat(val)||0:val}:i)}));
  }

  async function addTx(){
    if(!form.amount||!form.date)return;setSaving(true);
    const{data,error}=await apiAddTransaction({amount:parseFloat(form.amount),category:form.category,budget_line_id:form.budget_line_id||null,merchant:form.merchant,description:form.description,date:form.date,items:null},householdId,userId);
    if(!error&&data)setTransactions(prev=>[data,...prev]);
    setMode('list');setForm({amount:'',category:CATS[1],budget_line_id:'',merchant:'',description:'',date:today()});setSaving(false);
  }

  async function addQuick(){
    if(!quickAmt||!quickCat)return;setSaving(true);
    const QUICK_CAT_MAP={
      'Groceries':'🛒 Groceries',
      'Restaurants':'🍽️ Restaurants & Dining',
      'Fast Food':'🍔 Fast Food',
      'Coffee':'☕ Coffee & Drinks',
      'Bars':'🍺 Bars & Going Out',
      'Gas':'⛽ Gas & Fuel',
      'Entertainment':'🎉 Entertainment',
      'Gifts':'🎁 Gifts',
      'Pets':'🐾 Pets',
      'Fitness':'🏋️ Fitness',
      'Household':'🧹 Household & Supplies',
      'Other':'🧾 Other',
    };
    const cat=QUICK_CAT_MAP[quickCat.label]||CATS[CATS.length-1];
    const{data,error}=await apiAddTransaction({amount:parseFloat(quickAmt),category:cat,budget_line_id:null,merchant:quickCat.label,description:quickNote||'',date:today(),items:null},householdId,userId);
    if(!error&&data)setTransactions(prev=>[data,...prev]);
    setQuickCat(null);setQuickAmt('');setQuickNote('');setSaving(false);
  }

  async function deleteTx(id){setDeleting(id);const{error}=await apiDeleteTransaction(id);if(!error)setTransactions(prev=>prev.filter(t=>t.id!==id));setDeleting(null)}

  const months=useMemo(()=>{const seen=new Set();return mergedItems.map(t=>t.date?.slice(0,7)).filter(m=>m&&!seen.has(m)&&seen.add(m))},[mergedItems]);
  const filtered=useMemo(()=>mergedItems.filter(t=>{
    if(filter!=='all'&&t.date?.slice(0,7)!==filter)return false;
    if(search){const q=search.toLowerCase();return(t.merchant||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q)}
    return true;
  }),[mergedItems,filter,search]);
  const total=filtered.reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
  const familyCount=filtered.filter(t=>t._type==='family').length;
  const itemHistory=useMemo(()=>buildItemHistory(transactions),[transactions]);
  const filteredItems=useMemo(()=>itemHistory.filter(i=>!itemSearch||i.name.toLowerCase().includes(itemSearch.toLowerCase())),[itemHistory,itemSearch]);

  function blLabel(id){const e=budgetExpenses.find(e=>e.id===id);return e?(e.label||e.category):null}

  return(<div>
    <div className="st-row">
      <div className="st">Spending</div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
        {view==='list'&&<>
          <button className={`btn sm ${mode==='quick'?'btn-a':'btn-s'}`} onClick={()=>setMode(mode==='quick'?'list':'quick')}>⚡ Quick</button>
          <button className="btn btn-b sm" onClick={openScanner}>📄 Receipt</button>
          <button className="btn btn-p sm" onClick={()=>setMode(mode==='add'?'list':'add')}>+ Manual</button>
        </>}
        <button className={`btn sm ${view==='items'?'btn-p':'btn-s'}`} onClick={()=>setView(view==='items'?'list':'items')}>🗂 Items</button>
      </div>
    </div>

    {/* Items history view */}
    {view==='items'&&(<>
      <div className="alert alert-info" style={{marginBottom:10}}>All items from scanned receipts — when last bought, how often, average price.</div>
      <div className="fr" style={{marginBottom:10}}><label>Search items</label><input placeholder="e.g. milk, bread..." value={itemSearch} onChange={e=>setItemSearch(e.target.value)}/></div>
      {filteredItems.length===0&&<div className="card"><div className="empty"><div className="empty-icon">🗂</div><p>No item-level data yet. Import a receipt and items will appear here.</p></div></div>}
      {filteredItems.map((item,i)=>{
        const daysSince=item.lastDate?Math.floor((new Date()-new Date(item.lastDate+'T00:00:00'))/86400000):null;
        return(<div key={i} className="item-hist">
          <div style={{width:36,height:36,borderRadius:9,background:'var(--bdim)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🛒</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="item-hist-name">{item.name}</div>
            <div className="item-hist-meta">Avg {f$(item.avgPrice,2)} · ×{item.times} · {item.merchants.slice(0,2).join(', ')||'—'}</div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{fontSize:13,fontWeight:700,color:daysSince!=null&&daysSince<=7?'var(--green)':daysSince!=null&&daysSince<=30?'var(--amber)':'var(--muted)'}}>
              {daysSince===0?'Today':daysSince===1?'Yesterday':daysSince!=null?`${daysSince}d ago`:'—'}
            </div>
            <div style={{fontSize:10,color:'var(--muted)'}}>{item.lastDate?fdate(item.lastDate):''}</div>
          </div>
        </div>);
      })}
    </>)}

    {/* Transaction list view */}
    {view==='list'&&(<>
      {mode==='quick'&&(<div className="card" style={{marginBottom:10}}>
        <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>⚡ Quick Add</div>
        <div className="quick-grid">
          {QUICK_CATS.map(q=>(<button key={q.label} className={`quick-btn${quickCat?.label===q.label?' selected':''}`} onClick={()=>setQuickCat(q)}><div className="qb-icon">{q.icon}</div><div className="qb-label">{q.label}</div></button>))}
        </div>
        {quickCat&&(<>
          <div className="fg">
            <div className="fr" style={{margin:0}}><label>Amount ($)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={quickAmt} onChange={e=>setQuickAmt(e.target.value)} autoFocus/></div>
            <div className="fr" style={{margin:0}}><label>Note</label><input placeholder="Optional" value={quickNote} onChange={e=>setQuickNote(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addQuick()}/></div>
          </div>
          <button className="btn btn-p btn-full" style={{marginTop:10}} onClick={addQuick} disabled={saving||!quickAmt}>{saving?<span className="spinner"/>:`Log ${quickCat.icon} ${quickCat.label} — ${quickAmt?f$(quickAmt,2):'$?'}`}</button>
        </>)}
      </div>)}

      {mode==='add'&&(<div className="card" style={{marginBottom:10}}>
        <div style={{fontWeight:700,marginBottom:12,fontSize:13}}>Add Transaction</div>
        <div className="fg">
          <div className="fr"><label>Amount ($)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}/></div>
          <div className="fr"><label>Date</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
        </div>
        <div className="fr"><label>Category</label><select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
        {budgetExpenses.length>0&&<div className="fr"><label>Budget Line (optional — links to specific budget item)</label>
          <select value={form.budget_line_id} onChange={e=>setForm(f=>({...f,budget_line_id:e.target.value}))}>
            <option value="">— not linked —</option>
            {budgetExpenses.map(e=><option key={e.id} value={e.id}>{e.label||e.category}</option>)}
          </select>
        </div>}
        <div className="fr"><label>Merchant / Store</label><input placeholder="e.g. Shell, Kroger" value={form.merchant} onChange={e=>setForm(f=>({...f,merchant:e.target.value}))}/></div>
        <div className="fr"><label>Notes</label><input placeholder="Optional" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))}/></div>
        <div style={{display:'flex',gap:8}}><button className="btn btn-s" style={{flex:1}} onClick={()=>setMode('list')}>Cancel</button><button className="btn btn-p" style={{flex:2}} onClick={addTx} disabled={saving}>{saving?<span className="spinner"/>:'Save'}</button></div>
      </div>)}

      <div className="card" style={{marginBottom:10}}>
        <div className="fg">
          <div className="fr" style={{margin:0}}><label>Month</label><select value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">All Time</option>{months.map(m=><option key={m} value={m}>{new Date(m+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</option>)}</select></div>
          <div className="fr" style={{margin:0}}><label>Search</label><input placeholder="Merchant, category..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        </div>
        {filtered.length>0&&<div style={{marginTop:8,fontSize:11,color:'var(--muted)'}}>{filtered.length} items · <strong style={{color:'var(--red)'}}>{f$(total,2)}</strong>{familyCount>0&&<span style={{color:'var(--purple)',marginLeft:6}}>· {familyCount} family</span>}</div>}
      </div>

      {filtered.length?filtered.map(t=>{
        if(t._type==='family'){
          return(<div key={'ke-'+t.id} className="tx-item" style={{cursor:'default',borderLeft:`3px solid ${t._kidColor}`}}>
            <div className="tx-icon" style={{background:t._kidColor+'22',fontSize:18}}>{t._kidEmoji}</div>
            <div className="tx-info">
              <div className="tx-name">{t.description||t.category} <span style={{fontSize:10,background:'rgba(152,120,232,.15)',color:'var(--purple)',padding:'1px 5px',borderRadius:3,marginLeft:4,fontWeight:700}}>{t._kidName}</span></div>
              <div className="tx-meta"><span>{fdate(t.date)}</span><span style={{color:'var(--purple)',marginLeft:6}}>👨‍👩‍👧‍👦 Family</span></div>
            </div>
            <div style={{display:'flex',gap:5,alignItems:'center'}}>
              <div className="tx-amt" style={{color:'var(--purple)'}}>-{f$(t.amount,2)}</div>
              <button className="btn btn-d sm" style={{padding:'3px 7px'}} onClick={()=>deleteFamilyItem(t.id)} disabled={deleting===t.id}>{deleting===t.id?<span className="spinner"/>:'✕'}</button>
            </div>
          </div>);
        }
        const bl=t.budget_line_id?blLabel(t.budget_line_id):null;
        return(<div key={t.id} className="tx-item" style={{cursor:'pointer'}} onClick={()=>openEdit(t)}>
          <div className="tx-icon" style={{background:`${CAT_COLORS[t.category]||'var(--bl)'}22`}}>{catIcon(t.category||'Other')}</div>
          <div className="tx-info">
            <div className="tx-name">{t.merchant||t.description||t.category}</div>
            <div className="tx-meta" style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
              <span>{fdate(t.date)}</span>
              {bl&&<span className="bl-pill">{bl}</span>}
              {t.items?.length?<span style={{color:'var(--blue)'}}>· {t.items.filter(i=>i.included!==false).length} items</span>:null}
            </div>
          </div>
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            <div className="tx-amt red">-{f$(t.amount,2)}</div>
            <button className="btn btn-d sm" style={{padding:'3px 7px'}} onClick={e=>{e.stopPropagation();deleteTx(t.id)}} disabled={deleting===t.id}>{deleting===t.id?<span className="spinner"/>:'✕'}</button>
          </div>
        </div>);
      }):<div className="empty"><div className="empty-icon">🧾</div><p>No transactions. Use Quick Add, Receipt, or Manual.</p></div>}
    </>)}

    {/* Edit modal */}
    {editing&&editForm&&(<Modal title={`Edit — ${editing.merchant||'Transaction'}`} onClose={()=>{setEditing(null);setEditForm(null)}}>
      <div className="fg">
        <div className="fr"><label>Amount ($)</label><input type="number" step="0.01" value={editForm.amount} onChange={e=>setEditForm(f=>({...f,amount:e.target.value}))}/></div>
        <div className="fr"><label>Date</label><input type="date" value={editForm.date} onChange={e=>setEditForm(f=>({...f,date:e.target.value}))}/></div>
      </div>
      <div className="fr"><label>Merchant</label><input value={editForm.merchant} onChange={e=>setEditForm(f=>({...f,merchant:e.target.value}))}/></div>
      <div className="fr"><label>Category</label><select value={editForm.category} onChange={e=>setEditForm(f=>({...f,category:e.target.value}))}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
      {budgetExpenses.length>0&&(<div className="fr"><label>Budget Line — links this transaction to a specific budget item</label>
        <select value={editForm.budget_line_id||''} onChange={e=>setEditForm(f=>({...f,budget_line_id:e.target.value}))}>
          <option value="">— not linked —</option>
          {budgetExpenses.map(e=><option key={e.id} value={e.id}>{e.label||e.category}</option>)}
        </select>
      </div>)}
      <div className="fr"><label>Notes</label><input value={editForm.description} onChange={e=>setEditForm(f=>({...f,description:e.target.value}))}/></div>

      {editForm.items?.length>0&&(<>
        <div style={{fontSize:13,fontWeight:700,marginBottom:8,marginTop:4}}>Items — reassign each to a budget line</div>
        <div style={{overflowX:'auto'}}>
          <table className="ri-table">
            <thead>
              <tr>
                <th style={{width:22}}>✓</th>
                <th>Item</th>
                <th style={{width:65}}>Price</th>
                <th style={{width:90}}>Category</th>
                {budgetExpenses.length>0&&<th style={{width:110}}>Budget Line</th>}
              </tr>
            </thead>
            <tbody>
              {editForm.items.map(item=>(
                <tr key={item.id} className={item.included===false?'excluded':''}>
                  <td><input type="checkbox" className="ri-check" checked={item.included!==false} onChange={e=>updateEditItem(item.id,'included',e.target.checked)}/></td>
                  <td><span style={{fontSize:12}}>{item.name}</span></td>
                  <td><span style={{fontFamily:'var(--mono)',fontSize:12}}>{f$(item.price,2)}</span></td>
                  <td>
                    <select value={item.category||CATS[1]} onChange={e=>updateEditItem(item.id,'category',e.target.value)} style={{width:'100%'}}>
                      {CATS.map(c=><option key={c} value={c}>{c.split(' ').slice(1).join(' ')||c}</option>)}
                    </select>
                  </td>
                  {budgetExpenses.length>0&&(
                    <td>
                      <select value={item.budget_line_id||''} onChange={e=>updateEditItem(item.id,'budget_line_id',e.target.value||null)} style={{width:'100%'}}>
                        <option value="">— none —</option>
                        {budgetExpenses.map(e=><option key={e.id} value={e.id}>{e.label||e.category}</option>)}
                      </select>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </>)}

      <div style={{display:'flex',gap:8,marginTop:12}}>
        <button className="btn btn-s" style={{flex:1}} onClick={()=>{setEditing(null);setEditForm(null)}}>Cancel</button>
        <button className="btn btn-p" style={{flex:2}} onClick={saveEdit} disabled={saving}>{saving?<span className="spinner"/>:'Save Changes'}</button>
      </div>
    </Modal>)}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
// RECEIPT SCANNER
// ══════════════════════════════════════════════════════════════════
function ReceiptScanner({householdId,userId,onSaved,onClose,budget}){
  const[src,setSrc]=useState(null);
  const[stage,setStage]=useState('pick');
  const[progress,setProgress]=useState(0);
  const[parsed,setParsed]=useState(null);
  const[pasteText,setPasteText]=useState('');
  const[form,setForm]=useState({merchant:'',date:today(),items:[],total:0});
  const[err,setErr]=useState('');
  const[saving,setSaving]=useState(false);
  const fileRef=useRef(null);
  const textFileRef=useRef(null);
  const budgetExpenses=budget?.expenses||[];

  async function loadTesseract(){if(window.Tesseract)return;return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/tesseract.js@4/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

  async function handleImageFile(file){
    if(!file)return;setStage('processing');setProgress(0);setErr('');
    try{
      await loadTesseract();
      const result=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text')setProgress(Math.round(m.progress*100))}});
      processRawText(result.data.text);
    }catch(e){setErr('Could not read receipt. Try a clearer image.');setStage('pick');}
  }

  function processRawText(raw){
    const p=parseReceiptText(raw);
    setParsed({...p,raw});
    const items=p.items.map(i=>({
      ...i,
      category:CATS[1], // default Food & Dining
      budget_line_id:guessItemBudgetLine(i.name,budgetExpenses),
      included:true,
    }));
    setForm({merchant:p.merchant,date:today(),items,total:p.total});
    setStage('review');
  }

  function handleTextFile(e){
    const file=e.target.files?.[0];if(!file)return;
    setStage('processing');setProgress(100);
    const reader=new FileReader();
    reader.onload=ev=>{processRawText(ev.target.result||'');};
    reader.onerror=()=>{setErr('Could not read file.');setStage('pick');};
    reader.readAsText(file);
  }

  function handlePastedText(){
    if(!pasteText.trim()){setErr('Paste some receipt text first.');return;}
    processRawText(pasteText);
  }

  function updateItem(id,field,val){
    setForm(f=>({...f,items:f.items.map(i=>i.id===id?{...i,[field]:field==='price'?parseFloat(val)||0:val}:i)}));
  }
  function removeItem(id){setForm(f=>({...f,items:f.items.filter(i=>i.id!==id)}))}
  function addItem(){setForm(f=>({...f,items:[...f.items,{id:uid(),name:'',price:0,category:CATS[1],budget_line_id:null,included:true}]}))}

  function autoClassify(){
    setForm(f=>({...f,items:f.items.map(i=>({...i,budget_line_id:guessItemBudgetLine(i.name,budgetExpenses)||i.budget_line_id}))}));
  }

  const includedItems=form.items.filter(i=>i.included!==false);
  const calcTotal=useMemo(()=>includedItems.reduce((s,i)=>s+(parseFloat(i.price)||0),0),[includedItems]);

  async function save(){
    setSaving(true);
    const useTotal=parseFloat(form.total)||calcTotal;
    // Primary category: most common among included items
    const cats=includedItems.map(i=>i.category).filter(Boolean);
    const primaryCat=cats.length?cats.sort((a,b)=>cats.filter(c=>c===b).length-cats.filter(c=>c===a).length)[0]:CATS[1];
    // Primary budget_line_id: most common among included items that have one
    const bls=includedItems.map(i=>i.budget_line_id).filter(Boolean);
    const primaryBL=bls.length?bls.sort((a,b)=>bls.filter(c=>c===b).length-bls.filter(c=>c===a).length)[0]:null;
    const{data,error}=await apiAddTransaction({
      amount:parseFloat(useTotal.toFixed(2)),
      category:primaryCat,
      budget_line_id:primaryBL,
      merchant:form.merchant,
      description:`Receipt: ${form.merchant}`,
      date:form.date,
      items:form.items,
      receipt_text:parsed?.raw||null,
    },householdId,userId);
    if(error){setErr(error.message);setSaving(false);return;}
    onSaved(data);setSaving(false);
  }

  return(<Modal title="📄 Import Receipt" onClose={onClose}>
    {err&&<div className="alert alert-err">{err}</div>}

    {stage==='pick'&&(<>
      <div style={{fontWeight:600,marginBottom:10,fontSize:13}}>Choose how to import</div>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <button className={`src-btn${src==='camera'?' active':''}`} onClick={()=>{setSrc('camera');fileRef.current?.click()}}>
          <span className="src-icon">📷</span><span className="src-label">Take Photo</span>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={e=>handleImageFile(e.target.files?.[0])}/>
        </button>
        <button className={`src-btn${src==='file'?' active':''}`} onClick={()=>{setSrc('file');document.getElementById('pp-img-upload')?.click()}}>
          <span className="src-icon">🖼</span><span className="src-label">Upload Image</span>
        </button>
        <button className={`src-btn${src==='textfile'?' active':''}`} onClick={()=>{setSrc('textfile');textFileRef.current?.click()}}>
          <span className="src-icon">📁</span><span className="src-label">Text File</span>
          <input ref={textFileRef} type="file" accept=".txt,.csv,.text,text/plain" style={{display:'none'}} onChange={handleTextFile}/>
        </button>
        <button className={`src-btn${src==='paste'?' active':''}`} onClick={()=>setSrc('paste')}>
          <span className="src-icon">📋</span><span className="src-label">Paste Text</span>
        </button>
      </div>
      <input id="pp-img-upload" type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleImageFile(e.target.files?.[0])}/>
      {src==='paste'&&(<>
        <div className="fr"><label>Paste receipt text below</label>
          <textarea placeholder={"WALMART\nBread       2.49\nMilk        3.99\nGas Can     8.00\nTotal       14.48"} value={pasteText} onChange={e=>setPasteText(e.target.value)} style={{minHeight:130,fontFamily:'var(--mono)',fontSize:12}}/>
        </div>
        <button className="btn btn-p btn-full" onClick={handlePastedText} disabled={!pasteText.trim()}>Parse Receipt</button>
      </>)}
      <button className="btn btn-s btn-full" style={{marginTop:8}} onClick={onClose}>Cancel</button>
    </>)}

    {stage==='processing'&&(<div style={{textAlign:'center',padding:'28px 0'}}>
      <div style={{fontSize:40,marginBottom:12}}>🔍</div>
      <div style={{fontWeight:600,marginBottom:8}}>Reading receipt...</div>
      <div className="ocr-prog"><div className="ocr-bar" style={{width:`${progress}%`}}/></div>
      <div style={{fontSize:12,color:'var(--muted)'}}>{progress}%</div>
    </div>)}

    {stage==='review'&&(<>
      <div className="alert alert-ok" style={{marginBottom:10}}>Parsed! Classify each item, then save.</div>

      <div className="fg" style={{marginBottom:10}}>
        <div className="fr" style={{margin:0}}><label>Merchant</label><input value={form.merchant} onChange={e=>setForm(f=>({...f,merchant:e.target.value}))}/></div>
        <div className="fr" style={{margin:0}}><label>Date</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
      </div>

      {budgetExpenses.length>0&&(
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div style={{fontSize:12,color:'var(--muted)'}}>
            {includedItems.filter(i=>i.budget_line_id).length}/{includedItems.length} items linked to a budget line
          </div>
          <button className="btn btn-s sm" onClick={autoClassify}>✨ Auto-classify</button>
        </div>
      )}

      <div style={{overflowX:'auto'}}>
        <table className="ri-table">
          <thead>
            <tr>
              <th style={{width:22}}>✓</th>
              <th>Item</th>
              <th style={{width:70}}>Price</th>
              <th style={{width:90}}>Category</th>
              {budgetExpenses.length>0&&<th style={{width:110}}>Budget Line</th>}
              <th style={{width:24}}/>
            </tr>
          </thead>
          <tbody>
            {form.items.map(item=>(
              <tr key={item.id} className={item.included===false?'excluded':''}>
                <td><input type="checkbox" className="ri-check" checked={item.included!==false} onChange={e=>updateItem(item.id,'included',e.target.checked)}/></td>
                <td><input type="text" value={item.name} placeholder="Item name" onChange={e=>updateItem(item.id,'name',e.target.value)} style={{width:'100%',minWidth:80}}/></td>
                <td><input type="number" step="0.01" value={item.price} onChange={e=>updateItem(item.id,'price',e.target.value)} style={{width:65}}/></td>
                <td>
                  <select value={item.category||CATS[1]} onChange={e=>updateItem(item.id,'category',e.target.value)} style={{width:'100%'}}>
                    {CATS.map(c=><option key={c} value={c}>{c.split(' ').slice(1).join(' ')||c}</option>)}
                  </select>
                </td>
                {budgetExpenses.length>0&&(
                  <td>
                    <select value={item.budget_line_id||''} onChange={e=>updateItem(item.id,'budget_line_id',e.target.value||null)} style={{width:'100%'}}>
                      <option value="">— none —</option>
                      {budgetExpenses.map(e=><option key={e.id} value={e.id}>{e.label||e.category}</option>)}
                    </select>
                  </td>
                )}
                <td><button style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:16,lineHeight:1}} onClick={()=>removeItem(item.id)}>×</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <button className="btn btn-s sm" style={{marginBottom:12}} onClick={addItem}>+ Add Item</button>

      <div className="fr">
        <label>Total ($)</label>
        <input type="number" step="0.01" value={form.total||calcTotal.toFixed(2)} onChange={e=>setForm(f=>({...f,total:e.target.value}))}/>
        <div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>Sum of checked items: {f$(calcTotal,2)}</div>
      </div>

      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-s" style={{flex:1}} onClick={()=>{setStage('pick');setParsed(null);}}>↩ Back</button>
        <button className="btn btn-p" style={{flex:2}} onClick={save} disabled={saving}>{saving?<span className="spinner"/>:'💾 Save Receipt'}</button>
      </div>
    </>)}
  </Modal>);
}

// ══════════════════════════════════════════════════════════════════
// DEBTS TAB
// ══════════════════════════════════════════════════════════════════
function DebtsTab({debts,setDebts,householdId,budget,setBudget,transactions,setTransactions,userId}){
  const[subTab,setSubTab]=useState('debts'); // debts | payoff
  const[showAdd,setShowAdd]=useState(false);
  const[editing,setEditing]=useState(null);
  const[form,setForm]=useState({name:'',type:'credit_card',balance:'',rate:'',min_payment:'',due_day:'',note:''});
  const[saving,setSaving]=useState(false);
  const[payDebt,setPayDebt]=useState(null); // debt being paid
  const[payForm,setPayForm]=useState({amount:'',date:today(),note:''});
  const[paySaving,setPaySaving]=useState(false);
  const[expanded,setExpanded]=useState(null); // debt id with history expanded

  // Find the budget line linked to a debt
  function debtBudgetLine(debtId){
    return(budget.expenses||[]).find(e=>e.debt_id===debtId);
  }

  // Sync a debt to the budget — create or update its budget line
  async function syncDebtToBudget(debt,newBudget){
    const expenses=newBudget.expenses||[];
    const existing=expenses.find(e=>e.debt_id===debt.id);
    let newExpenses;
    if(existing){
      newExpenses=expenses.map(e=>e.debt_id===debt.id
        ?{...e,label:debt.name,amount:parseFloat(debt.min_payment)||0,due_day:parseInt(debt.due_day)||null}
        :e);
    }else{
      const line={id:uid(),label:debt.name,category:'🏦 Debt Payment',amount:parseFloat(debt.min_payment)||0,due_day:parseInt(debt.due_day)||null,debt_id:debt.id,is_variable:false};
      newExpenses=[...expenses,line];
    }
    const cfg={...newBudget,expenses:newExpenses};
    await apiSaveBudget(cfg,householdId);
    setBudget(cfg);
    return cfg;
  }

  // Remove a debt's budget line
  async function removeDebtFromBudget(debtId,newBudget){
    const expenses=(newBudget.expenses||[]).filter(e=>e.debt_id!==debtId);
    const cfg={...newBudget,expenses};
    await apiSaveBudget(cfg,householdId);
    setBudget(cfg);
  }

  function openAdd(){setForm({name:'',type:'credit_card',balance:'',rate:'',min_payment:'',due_day:'',note:''});setEditing(null);setShowAdd(true)}
  function openEdit(d){setForm({name:d.name,type:d.type,balance:String(d.balance),rate:String(d.rate),min_payment:String(d.min_payment),due_day:d.due_day||'',note:d.note||''});setEditing(d);setShowAdd(true)}

  async function saveDebt(){
    if(!form.name||!form.balance)return;setSaving(true);
    const debt={...form,balance:parseFloat(form.balance)||0,rate:parseFloat(form.rate)||0,min_payment:parseFloat(form.min_payment)||0,due_day:parseInt(form.due_day)||null,id:editing?.id||uid(),_new:!editing};
    let savedDebt=null;
    if(editing){
      const{data,error}=await apiSaveDebt(debt,householdId);
      if(!error&&data){setDebts(prev=>prev.map(d=>d.id===editing.id?data:d));savedDebt=data;}
    }else{
      const{data,error}=await apiSaveDebt(debt,householdId);
      if(!error&&data){setDebts(prev=>[...prev,data]);savedDebt=data;}
    }
    // Auto-sync to budget if there's a payment amount
    if(savedDebt&&(savedDebt.min_payment>0||editing)){
      await syncDebtToBudget(savedDebt,budget);
    }
    setShowAdd(false);setSaving(false);
  }

  async function del(id){
    if(!confirm('Delete this debt? Its budget line will also be removed.'))return;
    const{error}=await apiDeleteDebt(id);
    if(!error){
      setDebts(prev=>prev.filter(d=>d.id!==id));
      await removeDebtFromBudget(id,budget);
    }
  }

  async function logPayment(){
    if(!payForm.amount||!payDebt)return;
    setPaySaving(true);
    const{principalPortion,newBalance}=splitPayment(payForm.amount,payDebt.balance,payDebt.rate);
    const line=debtBudgetLine(payDebt.id);
    // Log transaction
    const{data,error}=await apiAddTransaction({
      amount:parseFloat(payForm.amount),
      category:'🏦 Debt Payment',
      merchant:payDebt.name,
      description:payForm.note||`Payment on ${payDebt.name}`,
      date:payForm.date,
      budget_line_id:line?.id||null,
      items:null,
    },householdId,userId);
    if(!error&&data){setTransactions(prev=>[data,...prev])}
    // Auto-update debt balance
    const updatedDebt={...payDebt,balance:parseFloat(newBalance.toFixed(2)),_new:false};
    const{data:debtData}=await apiSaveDebt(updatedDebt,householdId);
    if(debtData){
      setDebts(prev=>prev.map(d=>d.id===payDebt.id?debtData:d));
      await syncDebtToBudget(debtData,budget);
    }
    setPayDebt(null);setPayForm({amount:'',date:today(),note:''});
    setPaySaving(false);
  }

  // Recent payments for a debt (transactions linked to its budget line)
  function debtPayments(debtId){
    const line=debtBudgetLine(debtId);
    if(!line)return[];
    return(transactions||[]).filter(t=>t.budget_line_id===line.id).slice(0,5);
  }

  const totalBal=debts.reduce((s,d)=>s+(parseFloat(d.balance)||0),0);
  const totalMin=debts.reduce((s,d)=>s+(parseFloat(d.min_payment)||0),0);

  return(<div>
    {/* Sub-tab toggle */}
    <div style={{display:'flex',gap:6,marginBottom:16}}>
      <button className={`btn ${subTab==='debts'?'btn-p':'btn-s'}`} style={{flex:1}} onClick={()=>setSubTab('debts')}>📋 My Debts</button>
      <button className={`btn ${subTab==='payoff'?'btn-p':'btn-s'}`} style={{flex:1}} onClick={()=>setSubTab('payoff')}>🎯 Payoff Plan</button>
    </div>

    {subTab==='payoff'&&<StrategiesTab debts={debts} budget={budget} setBudget={setBudget} householdId={householdId}/>}

    {subTab==='debts'&&<>
    <div className="st-row"><div className="st">My Debts</div><button className="btn btn-p sm" onClick={openAdd}>+ Add Debt</button></div>
    {debts.length>0&&<div className="grid g3" style={{marginBottom:14}}>
      <div className="mcard"><div className="mlabel">Total Debt</div><div className="mval red">{f$(totalBal)}</div></div>
      <div className="mcard"><div className="mlabel">Accounts</div><div className="mval blue">{debts.length}</div></div>
      <div className="mcard"><div className="mlabel">Min. Monthly</div><div className="mval amber">{f$(totalMin)}</div></div>
    </div>}

    {debts.length?debts.map(d=>{
      const t=getType(d.type);
      const{months,totalInterest}=amortize(d.balance,d.rate,d.min_payment);
      const line=debtBudgetLine(d.id);
      const payments=debtPayments(d.id);
      const isExpanded=expanded===d.id;
      const thisMonth=new Date().toISOString().slice(0,7);
      const paidThisMonth=payments.filter(p=>p.date?.startsWith(thisMonth)).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      // Interest accrual since last due date
      const lastDue=getLastDueDate(d.due_day)||payments[0]?.date;
      const interest=calcDebtInterest(d.balance,d.rate,lastDue);

      return(<div key={d.id}>
        <div className="di" style={{cursor:'default'}}>
          <div className="dot" style={{background:t.c}}/>
          <div className="dinfo">
            <div className="dname">
              {d.name} <span className={`tag ${t.tc}`}>{t.l}</span>
              {d.due_day&&<span className="tag tgr" style={{marginLeft:4}}>Due {ordinal(d.due_day)}</span>}
              {line&&<span className="tag tg" style={{marginLeft:4}}>✓ In Budget</span>}
            </div>
            {d.note&&<div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{d.note}</div>}
            <div className="pgbar-wrap"><div className="pgbar-fill" style={{width:'60%',background:t.c}}/></div>
            <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>
              Payoff: {fmo(months)} · Est. total interest: {f$(totalInterest)}
              {paidThisMonth>0&&<span style={{color:'var(--green)',marginLeft:8}}>· Paid this month: {f$(paidThisMonth,2)}</span>}
            </div>
            {/* Accrued interest since last due date */}
            {interest.accrued>0.005&&<div style={{fontSize:10,marginTop:3,display:'flex',gap:8,flexWrap:'wrap'}}>
              <span style={{color:'var(--amber)'}}>⏱ {interest.daysSince}d interest: +{f$(interest.accrued,2)}</span>
              <span style={{color:'var(--muted)'}}>→ payoff today: <span style={{fontFamily:'var(--mono)',color:'var(--red)'}}>{f$(interest.currentTotal,2)}</span></span>
            </div>}
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2,marginLeft:8}}>
            <div style={{fontFamily:'var(--mono)',fontSize:15,fontWeight:700,color:t.c}}>{f$(d.balance,2)}</div>
            <div style={{fontSize:10,color:'var(--muted)'}}>principal balance</div>
            {interest.accrued>0.005&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--amber)'}}>{f$(interest.currentTotal,2)} w/ interest</div>}
            <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{d.rate}% APR · Min {f$(d.min_payment,2)}</div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'flex-end',marginTop:2}}>
              <button className="btn btn-p sm" onClick={()=>{setPayDebt(d);setPayForm({amount:String(d.min_payment||''),date:today(),note:''})}}>💳 Pay</button>
              <button className="btn btn-s sm" onClick={()=>setExpanded(isExpanded?null:d.id)}>{isExpanded?'▲':'📋'}</button>
              <button className="btn btn-s sm" onClick={()=>openEdit(d)}>Edit</button>
              <button className="btn btn-d sm" onClick={()=>del(d.id)}>Del</button>
            </div>
          </div>
        </div>

        {/* Payment history */}
        {isExpanded&&(<div style={{background:'var(--card)',border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 10px 10px',padding:'10px 14px',marginBottom:10,marginTop:-9}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:'var(--muted)'}}>Recent Payments</div>
          {payments.length?(
            payments.map(p=>(<div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--border)'}}>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{f$(p.amount,2)}</div>
                <div style={{fontSize:10,color:'var(--muted)'}}>{fdate(p.date)}{p.description&&p.description!==`Payment on ${d.name}`?` · ${p.description}`:''}</div>
              </div>
              <span style={{fontSize:11,color:'var(--green)'}}>✓ Logged</span>
            </div>))
          ):<div style={{fontSize:12,color:'var(--muted)'}}>No payments logged yet. Tap 💳 Pay to record one.</div>}
          {!line&&<div className="alert alert-warn" style={{marginTop:8,marginBottom:0,fontSize:11}}>No budget line linked. Edit this debt and save to auto-create one.</div>}
        </div>)}
      </div>);
    }):<div className="card"><div className="empty"><div className="empty-icon">🎉</div><p>No debts tracked yet.</p></div></div>}

    {/* Add/Edit debt modal */}
    {showAdd&&<Modal title={editing?'Edit Debt':'Add Debt'} onClose={()=>setShowAdd(false)}>
      {!editing&&<div className="alert alert-info" style={{marginBottom:12,fontSize:11}}>Adding a monthly payment will automatically create a budget line for this debt.</div>}
      <div className="fr"><label>Debt Name</label><input placeholder="e.g. Chase Visa" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
      <div className="fr"><label>Type</label><select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>{DTYPES.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}</select></div>
      <div className="fg">
        <div className="fr"><label>Balance ($)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={form.balance} onChange={e=>setForm(f=>({...f,balance:e.target.value}))}/></div>
        <div className="fr"><label>APR (%)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={form.rate} onChange={e=>setForm(f=>({...f,rate:e.target.value}))}/></div>
      </div>
      <div className="fg">
        <div className="fr"><label>Monthly Payment ($)</label><input type="number" min="0" step="1" placeholder="0" value={form.min_payment} onChange={e=>setForm(f=>({...f,min_payment:e.target.value}))}/></div>
        <div className="fr"><label>Due Day of Month</label><input type="number" min="1" max="31" placeholder="e.g. 15" value={form.due_day} onChange={e=>setForm(f=>({...f,due_day:e.target.value}))}/></div>
      </div>
      <div className="fr"><label>Note (optional)</label><input placeholder="Reminder or note" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/></div>
      <button className="btn btn-p btn-full" onClick={saveDebt} disabled={saving}>{saving?<span className="spinner"/>:'Save'}</button>
    </Modal>}

    {/* Log payment modal */}
    {payDebt&&(()=>{
      const amt=parseFloat(payForm.amount)||0;
      const{interestPortion,principalPortion,newBalance,monthlyInterest}=splitPayment(amt,payDebt.balance,payDebt.rate);
      const lastDue=getLastDueDate(payDebt.due_day);
      const interest=calcDebtInterest(payDebt.balance,payDebt.rate,lastDue);
      return(<Modal title={`💳 Log Payment — ${payDebt.name}`} onClose={()=>setPayDebt(null)}>
        <div className="fg">
          <div className="fr"><label>Amount Paid ($)</label><input type="number" min="0" step="0.01" placeholder="0.00" value={payForm.amount} onChange={e=>setPayForm(f=>({...f,amount:e.target.value}))} autoFocus/></div>
          <div className="fr"><label>Date</label><input type="date" value={payForm.date} onChange={e=>setPayForm(f=>({...f,date:e.target.value}))}/></div>
        </div>
        <div className="fr"><label>Notes (optional)</label><input placeholder="e.g. Extra principal, autopay" value={payForm.note} onChange={e=>setPayForm(f=>({...f,note:e.target.value}))}/></div>

        {/* Balance snapshot */}
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',marginBottom:12,fontSize:12}}>
          <div className="kv" style={{padding:'2px 0'}}><span className="kv-label">Principal balance</span><span style={{fontFamily:'var(--mono)',color:'var(--red)'}}>{f$(payDebt.balance,2)}</span></div>
          {interest.accrued>0.005&&<><div className="kv" style={{padding:'2px 0'}}><span className="kv-label">Interest since {fdate(lastDue)} ({interest.daysSince}d)</span><span style={{fontFamily:'var(--mono)',color:'var(--amber)'}}>+{f$(interest.accrued,2)}</span></div>
          <div className="kv" style={{padding:'2px 0'}}><span className="kv-label">Payoff today</span><span style={{fontFamily:'var(--mono)',color:'var(--red)',fontWeight:700}}>{f$(interest.currentTotal,2)}</span></div></>}
          <div className="kv" style={{padding:'2px 0'}}><span className="kv-label">Minimum payment</span><span style={{fontFamily:'var(--mono)'}}>{f$(payDebt.min_payment,2)}</span></div>
        </div>

        {/* Live payment breakdown */}
        {amt>0&&<div style={{background:'var(--gdim)',border:'1px solid rgba(16,208,112,.2)',borderRadius:8,padding:'10px 12px',marginBottom:12,fontSize:12}}>
          <div style={{fontWeight:700,marginBottom:6,fontSize:11,color:'var(--green)',textTransform:'uppercase',letterSpacing:'.5px'}}>Payment Breakdown</div>
          <div className="kv" style={{padding:'2px 0'}}><span className="kv-label">→ Interest portion</span><span style={{fontFamily:'var(--mono)',color:'var(--amber)'}}>{f$(interestPortion,2)}</span></div>
          <div className="kv" style={{padding:'2px 0'}}><span className="kv-label">→ Principal reduction</span><span style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{f$(principalPortion,2)}</span></div>
          <div className="divider" style={{margin:'6px 0'}}/>
          <div className="kv" style={{padding:'2px 0'}}><span style={{fontWeight:700}}>New balance after payment</span><span style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:800,color:'var(--blue)'}}>{f$(newBalance,2)}</span></div>
          {amt<monthlyInterest&&<div style={{fontSize:10,color:'var(--amber)',marginTop:6}}>⚠️ Payment is less than monthly interest ({f$(monthlyInterest,2)}) — balance will grow.</div>}
        </div>}

        {debtBudgetLine(payDebt.id)&&<div style={{fontSize:11,color:'var(--green)',marginBottom:12}}>✓ Linked to budget line — counts as actual spending</div>}
        {!debtBudgetLine(payDebt.id)&&<div style={{fontSize:11,color:'var(--amber)',marginBottom:12}}>⚠️ No budget line — edit this debt and save to create one</div>}
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-s" style={{flex:1}} onClick={()=>setPayDebt(null)}>Cancel</button>
          <button className="btn btn-p" style={{flex:2}} onClick={logPayment} disabled={paySaving||!payForm.amount}>{paySaving?<span className="spinner"/>:'Log & Update Balance'}</button>
        </div>
      </Modal>);
    })()}
    </>}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
// BUDGET TAB (with actual vs budgeted + variable expenses + avg suggestions)
// ══════════════════════════════════════════════════════════════════
function BudgetTab({budget,setBudget,householdId,debts,transactions,kids,kidExpenses}){
  const[editing,setEditing]=useState(false);
  const[budgetView,setBudgetView]=useState('current'); // current | history
  const[expandedMonth,setExpandedMonth]=useState(null);
  const[form,setForm]=useState({income:'',expenses:[]});
  const[saving,setSaving]=useState(false);
  const[showSuggestions,setShowSuggestions]=useState(false);

  function openEdit(){setForm({income:budget.income||'',expenses:(budget.expenses||[]).map(e=>({...e,id:e.id||uid()}))});setEditing(true)}
  function addExpense(){setForm(f=>({...f,expenses:[...f.expenses,{id:uid(),label:'',amount:'',category:CATS[12],due_day:'',is_variable:false}]}))}
  function updateExp(id,field,val){setForm(f=>({...f,expenses:f.expenses.map(e=>e.id===id?{...e,[field]:val}:e)}))}
  function removeExp(id){setForm(f=>({...f,expenses:f.expenses.filter(e=>e.id!==id)}))}
  async function save(){
    setSaving(true);
    // Preserve income derived from income_sources — only use form.income if no sources configured
    const savedIncome=hasIncomeSources?income:(parseFloat(form.income)||0);
    const cfg={...budget,income:savedIncome,expenses:form.expenses.map(e=>({...e,amount:parseFloat(e.amount)||0,due_day:e.is_variable?null:parseInt(e.due_day)||null}))};
    const{error}=await apiSaveBudget(cfg,householdId);
    if(!error){setBudget(cfg);setEditing(false)}
    setSaving(false);
  }

  const thisMonth=new Date().toISOString().slice(0,7);
  // Actual spending this month — keyed by budget_line_id first, then category
  const actualByLineId=useMemo(()=>{
    const map={};
    for(const t of (transactions||[])){
      if(!t.date?.startsWith(thisMonth))continue;
      if(t.budget_line_id){
        map[t.budget_line_id]=(map[t.budget_line_id]||0)+(parseFloat(t.amount)||0);
        // also split item-level amounts if items have individual budget_line_ids
        if(t.items?.length){
          const itemTotal=t.items.filter(i=>i.included!==false&&i.budget_line_id).reduce((s,i)=>s+(parseFloat(i.price)||0),0);
          if(itemTotal>0){
            // items with their own budget_line_id override the tx-level split
            const overrides={};
            for(const item of t.items){
              if(item.included===false||!item.budget_line_id)continue;
              overrides[item.budget_line_id]=(overrides[item.budget_line_id]||0)+(parseFloat(item.price)||0);
            }
            // subtract tx-level amount, re-add split
            const unassigned=parseFloat(t.amount)-itemTotal;
            map[t.budget_line_id]=Math.max(0,(map[t.budget_line_id]||0)-(parseFloat(t.amount)||0)+unassigned);
            for(const[blid,amt] of Object.entries(overrides)){
              map[blid]=(map[blid]||0)+amt;
            }
          }
        }
      }
    }
    return map;
  },[transactions,thisMonth]);

  const actualByCategory=useMemo(()=>{
    const map={};
    for(const t of (transactions||[])){
      if(!t.date?.startsWith(thisMonth))continue;
      if(!t.budget_line_id){
        // only count toward category if not linked to a budget line
        const c=t.category||'🧾 Other';
        map[c]=(map[c]||0)+(parseFloat(t.amount)||0);
      }
    }
    return map;
  },[transactions,thisMonth]);

  // Rolling 3-month averages for suggestions
  const rollingAvgs=useMemo(()=>rollingAvgByCategory(transactions||[],3),[transactions]);

  const totalExp=(budget.expenses||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  // Income: derived from income_sources if set, otherwise manual budget.income
  const sources=budget.income_sources||[];
  const derivedIncome=sources.length>0?totalMonthlyIncome(sources):0;
  const income=derivedIncome>0?derivedIncome:(parseFloat(budget.income)||0);
  const hasIncomeSources=sources.length>0;
  const debtMins=debts.reduce((s,d)=>s+(parseFloat(d.min_payment)||0),0);
  const committed=budget.committed_payment||0;
  // Only add debt minimums that DON'T already have a budget line (those are counted in totalExp)
  const debtsWithLine=new Set((budget.expenses||[]).filter(e=>e.debt_id).map(e=>e.debt_id));
  const orphanDebtMins=debts.filter(d=>!debtsWithLine.has(d.id)).reduce((s,d)=>s+(parseFloat(d.min_payment)||0),0);
  const committedExtra=Math.max(0,committed-debtMins); // extra above all minimums
  const debtLine=orphanDebtMins+committedExtra;

  // Kids spending this month
  const kidMonthTotal=useMemo(()=>(kidExpenses||[]).filter(ke=>ke.date?.startsWith(thisMonth)).reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0),[kidExpenses,thisMonth]);
  const kidByName=useMemo(()=>{
    const m={};
    for(const ke of (kidExpenses||[]).filter(ke=>ke.date?.startsWith(thisMonth))){
      const kid=(kids||[]).find(k=>k.id===ke.kid_id);
      const name=kid?`${kid.emoji||'👦'} ${kid.name}`:'Unknown';
      m[name]=(m[name]||0)+(parseFloat(ke.amount)||0);
    }
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  },[kidExpenses,kids,thisMonth]);

  const net=income-totalExp-debtLine-kidMonthTotal;

  // Unassigned = ALL spending not explicitly linked to a budget line via budget_line_id.
  // Category matching is intentionally NOT used — only explicit links count against a line.
  const miscByCat=useMemo(()=>Object.entries(actualByCategory).sort((a,b)=>b[1]-a[1]),[actualByCategory]);
  const miscTransactions=useMemo(()=>(transactions||[]).filter(t=>t.date?.startsWith(thisMonth)&&!t.budget_line_id).sort((a,b)=>new Date(b.date)-new Date(a.date)),[transactions,thisMonth]);
  const miscTotal=miscByCat.reduce((s,[,v])=>s+v,0);

  const netActual=net-miscTotal;

  // ── History computation ────────────────────────────────────────
  const allMonths=useMemo(()=>{
    const seen=new Set();
    for(const t of (transactions||[]))if(t.date?.slice(0,7))seen.add(t.date.slice(0,7));
    for(const ke of (kidExpenses||[]))if(ke.date?.slice(0,7))seen.add(ke.date.slice(0,7));
    return[...seen].sort((a,b)=>b.localeCompare(a)); // newest first
  },[transactions,kidExpenses]);

  function computeMonth(month){
    const txs=(transactions||[]).filter(t=>t.date?.startsWith(month));
    const kes=(kidExpenses||[]).filter(ke=>ke.date?.startsWith(month));
    const byLineId={};
    const byCategory={};
    for(const t of txs){
      if(t.budget_line_id)byLineId[t.budget_line_id]=(byLineId[t.budget_line_id]||0)+(parseFloat(t.amount)||0);
      else{const c=t.category||'🧾 Other';byCategory[c]=(byCategory[c]||0)+(parseFloat(t.amount)||0);}
    }
    const totalSpent=txs.reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
    const totalKids=kes.reduce((s,ke)=>s+(parseFloat(ke.amount)||0),0);
    const totalUnassigned=Object.values(byCategory).reduce((s,v)=>s+v,0);
    const inc=incomeSources.length>0?totalMonthlyIncome(incomeSources):(parseFloat(budget.income)||0);
    const net2=inc-totalSpent-totalKids;
    return{totalSpent,totalKids,totalUnassigned,byLineId,byCategory,net:net2,income:inc,txCount:txs.length};
  }

  const chartRef=useRef(null);const chartInst=useRef(null);
  const trendChartRef=useRef(null);const trendChartInst=useRef(null);
  useEffect(()=>{
    if(!trendChartRef.current||budgetView!=='history')return;
    if(trendChartInst.current)trendChartInst.current.destroy();
    const months=[...allMonths].reverse().slice(-6); // oldest first, last 6
    const labels=months.map(m=>new Date(m+'-01').toLocaleDateString('en-US',{month:'short',year:'2-digit'}));
    const inc=incomeSources.length>0?totalMonthlyIncome(incomeSources):(parseFloat(budget.income)||0);
    const spent=months.map(m=>computeMonth(m).totalSpent+computeMonth(m).totalKids);
    trendChartInst.current=new Chart(trendChartRef.current,{
      type:'bar',
      data:{labels,datasets:[
        {label:'Income',data:months.map(()=>inc),type:'line',borderColor:'#10d070',backgroundColor:'transparent',borderWidth:2,pointRadius:3,pointBackgroundColor:'#10d070',tension:.3,order:0},
        {label:'Spent',data:spent,backgroundColor:spent.map(s=>s>inc?'rgba(240,80,85,.7)':'rgba(96,128,240,.6)'),borderRadius:5,borderWidth:0,order:1},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#7a86a8',font:{size:10}}}},scales:{x:{ticks:{color:'#7a86a8',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#7a86a8',font:{size:10},callback:v=>'$'+v},grid:{color:'rgba(255,255,255,.05)'}}}}
    });
    return()=>{if(trendChartInst.current)trendChartInst.current.destroy()};
  },[budgetView,allMonths,budget.income,transactions,kidExpenses]);
  useEffect(()=>{
    if(!chartRef.current)return;if(chartInst.current)chartInst.current.destroy();
    const exps=(budget.expenses||[]).filter(e=>e.amount>0);
    if(!exps.length)return;
    const labels=exps.map(e=>e.label||e.category);
    const budgeted=exps.map(e=>e.amount);
    const actual=exps.map(e=>actualByLineId[e.id]||0);
    chartInst.current=new Chart(chartRef.current,{
      type:'bar',
      data:{labels,datasets:[
        {label:'Budgeted',data:budgeted,backgroundColor:exps.map(e=>`${CAT_COLORS[e.category]||'#6080f0'}55`),borderColor:exps.map(e=>CAT_COLORS[e.category]||'#6080f0'),borderWidth:1,borderRadius:4},
        {label:'Actual',data:actual,backgroundColor:exps.map((e,i)=>actual[i]>budgeted[i]?'rgba(240,80,85,.7)':'rgba(16,208,112,.7)'),borderWidth:0,borderRadius:4},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#7a86a8',font:{size:10}}}},scales:{x:{ticks:{color:'#7a86a8',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#7a86a8',font:{size:10},callback:v=>'$'+v},grid:{color:'rgba(255,255,255,.05)'}}}}
    });
    return()=>{if(chartInst.current)chartInst.current.destroy()};
  },[budget.expenses,actualByCategory]);

  if(editing)return(<div>
    <div className="st-row"><div className="st">Edit Budget</div><button className="btn btn-s sm" onClick={()=>setEditing(false)}>Cancel</button></div>

    {Object.keys(rollingAvgs).length>0&&(<div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:showSuggestions?10:0}}>
        <div style={{fontSize:13,fontWeight:700}}>💡 Suggestions from your spending history</div>
        <button className="btn btn-s sm" onClick={()=>setShowSuggestions(s=>!s)}>{showSuggestions?'Hide':'Show'}</button>
      </div>
      {showSuggestions&&Object.entries(rollingAvgs).filter(([,v])=>v>5).sort((a,b)=>b[1]-a[1]).map(([cat,avg])=>(
        <div key={cat} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--border)',fontSize:12}}>
          <span>{cat} <span style={{fontSize:10,color:'var(--muted)'}}>3-mo avg</span></span>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{fontFamily:'var(--mono)',color:'var(--amber)'}}>{f$(avg,0)}/mo</span>
            <button className="btn btn-s sm" style={{padding:'2px 7px',fontSize:10}} onClick={()=>{
              const match=form.expenses.find(e=>e.category===cat);
              if(match)updateExp(match.id,'amount',Math.round(avg).toString());
              else setForm(f=>({...f,expenses:[...f.expenses,{id:uid(),label:cat.split(' ').slice(1).join(' '),amount:Math.round(avg).toString(),category:cat,due_day:'',is_variable:true}]}));
            }}>Use</button>
          </div>
        </div>
      ))}
    </div>)}

    <div className="card" style={{marginBottom:12}}>
      {hasIncomeSources
        ?<div style={{padding:'10px 0'}}>
           <label>Monthly Take-Home Income</label>
           <div style={{fontFamily:'var(--mono)',fontSize:22,fontWeight:800,color:'var(--green)',marginTop:4}}>{f$(income,2)}</div>
           <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Auto-calculated from {sources.length} income source{sources.length!==1?'s':''} in Paycheck Planner. Go to <strong>Money → Paychecks</strong> to edit.</div>
         </div>
        :<div className="fr" style={{margin:0}}><label>Monthly Take-Home Income ($)</label><input type="number" min="0" step="100" placeholder="0" value={form.income} onChange={e=>setForm(f=>({...f,income:e.target.value}))}/><div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Or set up income sources in <strong>Paycheck Planner</strong> to auto-calculate this.</div></div>}
    </div>
    <div className="card">
      <div style={{fontWeight:700,marginBottom:10}}>Monthly Expenses</div>
      <div style={{fontSize:11,color:'var(--muted)',marginBottom:12}}>Mark an expense <strong>Variable</strong> if it has no fixed due date (gas, groceries, dining). It will be distributed across your paychecks automatically.</div>
      {form.expenses.map(e=>(<div key={e.id} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'10px',marginBottom:8}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 80px',gap:7,marginBottom:7,alignItems:'end'}}>
          <div><label>Label</label><input placeholder="e.g. Groceries" value={e.label} onChange={ev=>updateExp(e.id,'label',ev.target.value)}/></div>
          <div><label>Category</label><select value={e.category} onChange={ev=>updateExp(e.id,'category',ev.target.value)}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
          <div><label>$/mo</label><input type="number" min="0" step="1" value={e.amount} onChange={ev=>updateExp(e.id,'amount',ev.target.value)}/></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <label style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',textTransform:'none',letterSpacing:0,fontWeight:500,fontSize:12,marginBottom:0}}>
            <input type="checkbox" checked={!!e.is_variable} onChange={ev=>updateExp(e.id,'is_variable',ev.target.checked)} style={{width:'auto',accentColor:'var(--amber)'}}/>
            Variable (no fixed due date)
          </label>
          {!e.is_variable&&<div style={{display:'flex',alignItems:'center',gap:6,flex:1}}>
            <label style={{marginBottom:0,whiteSpace:'nowrap',fontSize:11}}>Due Day</label>
            <input type="number" min="1" max="31" placeholder="—" value={e.due_day||''} onChange={ev=>updateExp(e.id,'due_day',ev.target.value)} style={{width:60}}/>
          </div>}
          <button className="btn btn-d sm" style={{marginLeft:'auto'}} onClick={()=>removeExp(e.id)}>✕ Remove</button>
        </div>
      </div>))}
      <button className="btn btn-s sm" onClick={addExpense}>+ Add Expense</button>
      <div className="divider"/>
      <button className="btn btn-p btn-full" onClick={save} disabled={saving}>{saving?<span className="spinner"/>:'Save Budget'}</button>
    </div>
  </div>);

  return(<div>
    <div className="st-row">
      <div className="st">Budget</div>
      <div style={{display:'flex',gap:6}}>
        <div style={{display:'flex',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
          <button className={`btn sm ${budgetView==='current'?'btn-p':'btn-s'}`} style={{borderRadius:0,border:'none'}} onClick={()=>setBudgetView('current')}>This Month</button>
          <button className={`btn sm ${budgetView==='history'?'btn-p':'btn-s'}`} style={{borderRadius:0,border:'none'}} onClick={()=>setBudgetView('history')}>📅 History</button>
        </div>
        {budgetView==='current'&&<button className="btn btn-s sm" onClick={openEdit}>Edit</button>}
      </div>
    </div>

    {/* ── HISTORY VIEW ── */}
    {budgetView==='history'&&(<>
      {allMonths.length===0
        ?<div className="card"><div className="empty"><div className="empty-icon">📅</div><p>No spending history yet.</p></div></div>
        :(<>
          <div className="card" style={{marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>Spending vs Income — Last 6 Months</div>
            <div className="chwrap"><canvas ref={trendChartRef}/></div>
          </div>
          {allMonths.map(month=>{
            const{totalSpent,totalKids,totalUnassigned,byLineId,byCategory,net:mnet,income:minc,txCount}=computeMonth(month);
            const isExpanded=expandedMonth===month;
            const isOver=totalSpent+totalKids>minc;
            const label=new Date(month+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'});
            const pct=minc>0?Math.min(100,Math.round((totalSpent+totalKids)/minc*100)):0;
            return(<div key={month} style={{marginBottom:8}}>
              <div style={{background:'var(--surface)',border:`1px solid ${isOver?'rgba(240,80,85,.3)':'var(--border)'}`,borderRadius:10,padding:'12px 14px',cursor:'pointer'}} onClick={()=>setExpandedMonth(isExpanded?null:month)}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14}}>{label}</div>
                    <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{txCount} transaction{txCount!==1?'s':''}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontFamily:'var(--mono)',fontSize:15,fontWeight:800,color:isOver?'var(--red)':'var(--text)'}}>{f$(totalSpent+totalKids,2)}</div>
                    <div style={{fontSize:11,fontFamily:'var(--mono)',color:mnet>=0?'var(--green)':'var(--red)',fontWeight:700}}>{mnet>=0?'+':''}{f$(mnet,2)} {mnet>=0?'under':'over'}</div>
                  </div>
                  <div style={{fontSize:16,color:'var(--muted)'}}>{isExpanded?'▲':'▼'}</div>
                </div>
                <div className="pgbar-wrap" style={{marginTop:8}}>
                  <div className="pgbar-fill" style={{width:`${pct}%`,background:isOver?'var(--red)':pct>85?'var(--amber)':'var(--green)'}}/>
                </div>
                <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>{pct}% of income ({f$(minc,0)})</div>
              </div>
              {isExpanded&&(<div style={{background:'var(--card)',border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 10px 10px',padding:'12px 14px'}}>
                {/* Budget lines */}
                {(budget.expenses||[]).length>0&&(<>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Budget Lines</div>
                  {(budget.expenses||[]).map(e=>{
                    const actual=byLineId[e.id]||0;
                    const budgeted=parseFloat(e.amount)||0;
                    const over=actual>budgeted&&budgeted>0;
                    return(<div key={e.id} className="kv" style={{padding:'4px 0',borderBottom:'1px solid var(--border)'}}>
                      <span style={{fontSize:12}}>{e.label||e.category}</span>
                      <span style={{fontFamily:'var(--mono)',fontSize:12,color:over?'var(--red)':actual>0?'var(--text)':'var(--faint)',fontWeight:over?700:400}}>
                        {f$(actual,2)}<span style={{color:'var(--faint)',fontWeight:400}}> / {f$(budgeted,2)}</span>
                      </span>
                    </div>);
                  })}
                </>)}
                {/* Category breakdown for unassigned */}
                {Object.keys(byCategory).length>0&&(<>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',margin:'10px 0 6px'}}>⚠️ Unassigned</div>
                  {Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>(
                    <div key={cat} className="kv" style={{padding:'3px 0'}}>
                      <span style={{fontSize:12}}>{cat}</span>
                      <span style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--amber)'}}>{f$(amt,2)}</span>
                    </div>
                  ))}
                </>)}
                {/* Kids */}
                {totalKids>0&&<><div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',margin:'10px 0 6px'}}>👨‍👩‍👧‍👦 Family</div>
                  <div className="kv" style={{padding:'3px 0'}}><span style={{fontSize:12}}>Total family spending</span><span style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--purple)'}}>{f$(totalKids,2)}</span></div></>}
                {/* Summary */}
                <div style={{marginTop:10,padding:'8px 10px',background:'var(--surface)',borderRadius:7}}>
                  <div className="kv" style={{padding:'2px 0'}}><span style={{fontSize:12,fontWeight:700}}>Total spent</span><span style={{fontFamily:'var(--mono)',fontWeight:700}}>{f$(totalSpent+totalKids,2)}</span></div>
                  {minc>0&&<div className="kv" style={{padding:'2px 0'}}><span style={{fontSize:12,fontWeight:700}}>Net</span><span style={{fontFamily:'var(--mono)',fontWeight:800,color:mnet>=0?'var(--green)':'var(--red)'}}>{f$(mnet,2)}</span></div>}
                </div>
              </div>)}
            </div>);
          })}
        </>)}
    </>)}

    {/* ── CURRENT MONTH VIEW ── */}
    {budgetView==='current'&&(<>
      <div className="grid g3" style={{marginBottom:12}}>
      <div className="mcard"><div className="mlabel">Income</div><div className="mval green">{f$(income)}</div>{hasIncomeSources&&<div className="msub">{(budget.income_sources||[]).length} sources</div>}</div>
      <div className="mcard"><div className="mlabel">Budgeted Out</div><div className="mval red">{f$(totalExp+debtLine+kidMonthTotal,2)}</div><div className="msub">expenses + debt + family</div></div>
      <div className="mcard"><div className="mlabel">Remaining</div><div className="mval" style={{color:netActual>=0?'var(--green)':'var(--red)'}}>{f$(netActual)}</div><div className="msub">after actual spending</div></div>
    </div>
    {budget.committed_strategy&&<div className="commit-badge"><span style={{fontSize:18}}>✅</span><div style={{fontSize:12}}><strong>{budget.committed_strategy==='avalanche'?'Avalanche':'Snowball'} plan active</strong> — {f$(committed,2)}/mo debt payment included</div></div>}

    {(budget.expenses||[]).length?(<>
      <div className="card" style={{marginBottom:12}}><div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Budgeted vs Actual — {new Date(thisMonth+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div><div className="chwrap"><canvas ref={chartRef}/></div></div>

      <div className="card">
        <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>By Line Item</div>
        {(budget.expenses||[]).map(e=>{
          const actual=actualByLineId[e.id]||0;
          const budgeted=parseFloat(e.amount)||0;
          const pct=budgeted>0?Math.min(actual/budgeted*100,100):0;
          const over=actual>budgeted&&budgeted>0;
          return(<div key={e.id} className="bva-row">
            <div className="bva-labels">
              <div className="bva-name">
                {e.label||e.category}
                {e.is_variable&&<span className="var-badge" style={{marginLeft:6}}>VAR</span>}
                {e.due_day&&!e.is_variable&&<span style={{fontSize:10,color:'var(--muted)',marginLeft:6}}>due {ordinal(e.due_day)}</span>}
              </div>
              <div className="bva-nums">
                <span style={{color:over?'var(--red)':'var(--text)',fontFamily:'var(--mono)',fontWeight:700}}>{f$(actual,2)}</span>
                <span>/ {f$(budgeted,2)}</span>
                {over&&<span style={{color:'var(--red)',fontWeight:700}}>+{f$(actual-budgeted,2)}</span>}
                {!over&&budgeted>0&&<span style={{color:'var(--green)'}}>{f$(budgeted-actual,2)} left</span>}
              </div>
            </div>
            <div className="bva-track"><div className="bva-fill" style={{width:`${pct}%`,background:over?'var(--red)':pct>80?'var(--amber)':'var(--green)'}}/></div>
          </div>);
        })}
        {(()=>{
          return(<>
            {orphanDebtMins>0&&<><div className="divider"/><div className="kv" style={{padding:'6px 0'}}><span>🏦 Other Debt Minimums <span style={{fontSize:10,color:'var(--muted)'}}>(no budget line — edit debt to create one)</span></span><span style={{fontFamily:'var(--mono)',color:'var(--red)'}}>{f$(orphanDebtMins,2)}/mo</span></div></>}
            {committedExtra>0&&<><div className="divider"/><div className="kv" style={{padding:'6px 0'}}><span>💡 Extra Payoff ({budget.committed_strategy})</span><span style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{f$(committedExtra,2)}/mo</span></div></>}
          </>);
        })()}
        {kidMonthTotal>0&&(<>
          <div className="divider"/>
          <div style={{marginBottom:4}}>
            <div className="kv" style={{padding:'4px 0'}}>
              <span style={{fontWeight:700}}>👨‍👩‍👧‍👦 Family Spending</span>
              <span style={{fontFamily:'var(--mono)',color:'var(--purple)',fontWeight:700}}>{f$(kidMonthTotal,2)}</span>
            </div>
            {kidByName.map(([name,amt])=>(
              <div key={name} className="kv" style={{padding:'2px 0 2px 12px'}}>
                <span style={{fontSize:12,color:'var(--muted)'}}>{name}</span>
                <span style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--purple)'}}>{f$(amt,2)}</span>
              </div>
            ))}
          </div>
        </>)}
        {miscTotal>0&&(<>
          <div className="divider"/>
          <div>
            <div className="kv" style={{padding:'4px 0 8px'}}>
              <span style={{fontWeight:700}}>⚠️ Unassigned Spending</span>
              <span style={{fontFamily:'var(--mono)',color:'var(--amber)',fontWeight:700}}>{f$(miscTotal,2)}</span>
            </div>
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>Spending not linked to any budget line. Tap a transaction in the Spending tab to assign it.</div>
            {miscTransactions.map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                <div style={{fontSize:15}}>{catIcon(t.category||'Other')}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{t.merchant||t.description||t.category}</div>
                  <div style={{fontSize:10,color:'var(--muted)'}}>{t.category} · {fshort(t.date)}</div>
                </div>
                <div style={{fontFamily:'var(--mono)',fontSize:12,fontWeight:700,color:'var(--amber)',whiteSpace:'nowrap'}}>{f$(t.amount,2)}</div>
              </div>
            ))}
          </div>
        </>)}
        <div className="divider"/>
        <KV label="Net (after all spending)" val={f$(netActual)} color={netActual>=0?'var(--green)':'var(--red)'}/>
      </div>
    </>):<div className="card"><div className="empty"><div className="empty-icon">📊</div><p>No budget set up yet.</p><button className="btn btn-p" style={{marginTop:12}} onClick={openEdit}>Set Up Budget</button></div></div>}
    </>)}
  </div>);
}
